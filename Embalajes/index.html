.cols input{width:auto;padding:0}
.pv{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}.pv table{border-collapse:collapse;font-size:12px;white-space:nowrap}.pv td,.pv th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}.pv th{background:var(--bg);color:var(--mut)}

.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--tx)}.leaflet-popup-content{font:14px/1.35 'Barlow',sans-serif;min-width:230px;margin:10px}.leaflet-popup-content .vc{margin:0;border:0;box-shadow:none;padding:0;border-left:0}.leaflet-popup-content .acts .btn{min-height:38px;padding:8px 10px;font-size:13px}

:root[data-theme=light] .clk,:root[data-theme=light] .pct,:root[data-theme=light] .hora{color:#9a6700}

header{flex-wrap:wrap}header h1{flex:1 1 130px;min-width:0}header h1 small{text-transform:none;letter-spacing:0}
/* tarjetas compactas */
.vc{padding:8px 10px;margin:0 0 6px;border-left-width:5px;border-radius:10px}

.kv{margin:4px 0 0;gap:2px 10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.quien{font-size:12px;margin-top:5px}

/* camión */
.truck{position:relative;flex:0 1 330px;min-width:250px;color:var(--tx)}.truck svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}

<script>
const $=id=>document.getElementById(id);
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>{const e=$(id);return e?e.value.trim():''};
const hm=s=>(s||'').slice(11,16);
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const fecha=f=>{if(!f)return'';const d=new Date(f+'T12:00:00Z');return DIAS[d.getUTCDay()]+' '+f.slice(8,10)+'/'+f.slice(5,7)};
const corto=n=>String(n||'').split(' ').slice(0,2).join(' ');
function reloj(){const e=$('clk');if(e)e.textContent=new Date(Date.now()-5*3600*1000).toISOString().slice(11,16)}
const hoyL=()=>new Date(Date.now()-5*3600*1000).toISOString().slice(0,10);
const ahora=()=>new Date(Date.now()-5*3600*1000).toISOString().slice(0,19);
const sumaDias=(f,n)=>{const d=new Date(f+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}
function modal(h){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML='<div>'+h+'</div>';m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){const m=$('modal');if(m)m.remove()}

const PF={wb:null,nombre:'',hoja:'',head:[],rows:[],sel:{}};
function leerArchivo(f){
  if(!f)return;
  if(typeof XLSX==='undefined')return toast('Se necesita internet para leer el Excel',true);
  const r=new FileReader();
  r.onload=()=>{try{PF.wb=XLSX.read(new Uint8Array(r.result),{type:'array'});PF.nombre=f.name;
    hoja(mejorHoja())}catch(e){toast('No se pudo leer el archivo',true)}};
  r.onerror=()=>toast('No se pudo abrir el archivo',true);
  r.readAsArrayBuffer(f);
}
function parseHoja(nombre){
  const m=XLSX.utils.sheet_to_json(PF.wb.Sheets[nombre],{header:1,raw:false,defval:''}).map(r=>r.map(c=>String(c==null?'':c).replace(/\s+/g,' ').trim()));
  const tope=Math.min(m.length,30);let hi=-1;
  for(let i=0;i<tope;i++){if(m[i].some(c=>/^placa/.test(norm(c)))&&m[i].filter(Boolean).length>=2){hi=i;break}}
  if(hi<0){let best=0;for(let i=0;i<tope;i++){const n=m[i].filter(Boolean).length;if(n>best){best=n;hi=i}}}
  if(hi<0)hi=0;
  const ncol=Math.max(0,...m.map(r=>r.length)),head=Array.from({length:ncol},(_,i)=>m[hi]?m[hi][i]||'':'');
  const pi=head.findIndex(c=>/^placa|vehiculo/.test(norm(c)));
  let rows=m.slice(hi+1).filter(r=>pi>=0?PLACA_RE.test(r[pi]||''):r.filter(Boolean).length>=2);
  rows=rows.filter(r=>!/^total/.test(norm(r.find(Boolean)||'')));
  head.forEach((c,i)=>{if(!c&&i>0&&/barrio 2/.test(norm(head[i-1]))&&rows.some(r=>r[i]))head[i]='Escolta'});
  return{head,rows,pi};
}
/* elige la hoja con una fila por placa (la tabla por vehículo) */
function mejorHoja(){
  let best=null,bs=-1;
  PF.wb.SheetNames.forEach(n=>{try{const p=parseHoja(n);if(!p.rows.length||p.pi<0)return;
    const u=new Set(p.rows.map(r=>norm(r[p.pi]))).size/p.rows.length;
    const s=u+(/proyect/i.test(n)?1:0)+(/dinam|resumen/i.test(n)?.5:0);
    if(s>bs){bs=s;best=n}}catch(e){}});
  return best||PF.wb.SheetNames.find(n=>/proyect/i.test(n))||PF.wb.SheetNames[0];
}
/* coordenadas de las entregas (hoja de pedidos con CX/CY) -> ubicación de cada vehículo */
const cn=v=>{if(typeof v==='number')return isFinite(v)?v:null;const s=String(v==null?'':v).trim().replace(',','.');if(!/^-?\d+(\.\d+)?$/.test(s))return null;return parseFloat(s)};
function coordsExtra(nombre,p){
  const head=p.head.slice(),rows=p.rows.map(r=>r.slice());
  if(p.pi<0||head.some(c=>/^paradas$/.test(norm(c))))return{head,rows};
  const pts={};
  PF.wb.SheetNames.forEach(n=>{if(n===nombre)return;
    const m=XLSX.utils.sheet_to_json(PF.wb.Sheets[n],{header:1,raw:true,defval:''});
    for(let hi=0;hi<Math.min(m.length,15);hi++){
      const row=m[hi].map(c=>norm(String(c)));
      const ip=row.findIndex(c=>/^placa/.test(c)||c==='vehiculo');if(ip<0)continue;
      let ia=row.findIndex(c=>/^(cy|y|lat|latitud|coordenada y)$/.test(c)),io=row.findIndex(c=>/^(cx|x|lon|lng|long|longitud|coordenada x)$/.test(c));
      if(ia<0||io<0){
        const body=m.slice(hi+1,hi+80);
        const rango=(j,lo,hi2)=>{const v=body.map(r=>cn(r[j])).filter(x=>x!==null);return v.length>=3&&v.filter(x=>x>lo&&x<hi2&&x!==Math.round(x)).length/v.length>.8};
        for(let j=0;j<row.length;j++){if(ia<0&&rango(j,-4.5,13.5))ia=j;else if(io<0&&rango(j,-82,-66))io=j}
      }
      if(ia<0||io<0)continue;
      m.slice(hi+1).forEach(r=>{let la=cn(r[ia]),lo=cn(r[io]);if(la===null||lo===null)return;
        if(la<-60&&lo>-6){const t=la;la=lo;lo=t}
        if(!(la>-5&&la<14&&lo<-60&&lo>-82))return;
        const pl=String(r[ip]||'').replace(/[\s-]/g,'');
        (pl.match(/[A-Za-z]{3}\d{2,3}[A-Za-z]?/g)||[]).forEach(t=>{t=t.toUpperCase();(pts[t]=pts[t]||[]).push([la,lo])});
      });
      break;
    }
  });
  const n0=head.length;let hay=false;
  rows.forEach(r=>{
    const toks=(String(r[p.pi]||'').replace(/[\s-]/g,'').match(/[A-Za-z]{3}\d{2,3}[A-Za-z]?/g)||[]).map(t=>t.toUpperCase());
    let q=[];toks.forEach(t=>{q=q.concat(pts[t]||[])});if(!q.length)return;hay=true;
    const la=q.reduce((s,a)=>s+a[0],0)/q.length,lo=q.reduce((s,a)=>s+a[1],0)/q.length;
    const seen={},u=[];q.forEach(a=>{const k=a[0].toFixed(4)+','+a[1].toFixed(4);if(!seen[k]){seen[k]=1;u.push(k)}});
    const paso=Math.max(1,Math.ceil(u.length/80));
    r[n0]=la.toFixed(5);r[n0+1]=lo.toFixed(5);r[n0+2]=u.filter((_,i)=>i%paso===0).join(';');
  });
  if(hay)head.push('Latitud','Longitud','Paradas');
  return{head,rows,pi:p.pi};
}
function hoja(nombre){
  PF.hoja=nombre;const p=parseHoja(nombre);try{const e=coordsExtra(nombre,p);p.head=e.head;p.rows=e.rows}catch(err){}PF.head=p.head;PF.rows=p.rows;PF.sel={};

 <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="irdia" data-d="0">Hoy</button><button class="btn ghost sm" data-act="irdia" data-d="1">Mañana</button><span class="mut">La Proyectada se hace el día anterior: carga “Mañana”.</span></div>

 <div id="modo1" style="margin-top:12px"><button class="btn ghost big" data-act="correo" style="margin-bottom:10px">📧 Traer del correo (Centro Control)</button><button class="drop" data-act="elegir">📎 Elegir la Proyectada (Excel)</button><input type="file" id="pf" accept=".xlsx,.xls,.xlsm,.csv" style="display:none"><div id="pv"></div></div>
 <div id="modo2" style="display:none;margin-top:12px"><p class="mut" style="margin:0 0 8px">Copia las filas desde Excel y pégalas aquí. Los coordinadores las ven al instante.</p>
 <textarea id="tx" rows="6" placeholder="Pega aquí la lista…"></textarea>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="enc" style="width:auto"> La primera línea son los títulos de las columnas</label>
 <div class="row" style="margin-top:10px"><button class="btn ok grow" data-act="cargar" data-rep="0">➕ Agregar al día</button><button class="btn ghost grow" data-act="cargar" data-rep="1">♻ Reemplazar el día</button></div></div>
 <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
 <div class="row"><button class="btn ghost sm" data-act="copiar">🔗 Copiar enlace para coordinadores</button><button class="btn ghost sm" data-act="wa">💬 WhatsApp</button><button class="btn ghost sm badc" data-act="borrar" style="margin-left:auto">🗑 Borrar el día</button></div></details>`}

const ACT={
rol(d){LG.rol=d.r;pintaLogin()},entrar,salir(){salir()},
filtro(d){EM.f=EM.f===d.f&&d.f!=='todos'?'todos':d.f;pinta()},
vista(d){EM.v=d.v;pinta();if(d.v==='mapa')setTimeout(()=>MAP&&MAP.invalidateSize(),50)},soporte,
marca(d){accion({id:d.id,resultado:d.r||'Llamado'})},
des(d){accion({id:d.id,deshacer:true})},
llego(d){const x=EM.d.items.find(i=>i.ID===d.id);if(!x)return;if(srvV2())accion({id:d.id,llego:true});else accion({id:d.id,nota:armaNota(notaLimpia(x),{ts:ahora(),quien:corto(S.nombre||'')})})},
quitaLlego(d){const x=EM.d.items.find(i=>i.ID===d.id);if(!x)return;const p={id:d.id};if(srvV2())p.llego=false;if(tagDe(x))p.nota=armaNota(notaLimpia(x),null);accion(p)},
nota(d){const x=EM.d.items.find(i=>i.ID===d.id);modal(`<h2 style="margin-top:0">Nota</h2><input type="hidden" id="ni" value="${esc(d.id)}"><textarea id="nt" rows="3" maxlength="140" placeholder="Ej: pidió que lo llamen a las 3 pm">${esc(x?notaLimpia(x):'')}</textarea><br><br><button class="btn big" data-act="notaOk">Guardar</button>`)},
ubic(d){const x=EM.d.items.find(i=>i.ID===d.id);EM.bar=null;modal(`<h2 style="margin-top:0">📍 Posición del vehículo al contacto</h2><p class="mut" style="margin:0 0 8px">Dirección, vía o punto donde estaba el vehículo cuando lo llamaste. Te muestro el barrio donde queda.</p><input type="hidden" id="ui" value="${esc(d.id)}"><textarea id="ut" rows="2" maxlength="115" placeholder="Ej: Autopista Sur con Calle 57 sur, frente a Éxito">${esc(x?ubicLimpia(x):'')}</textarea><div id="ubb" class="ubb mut">Escribe la dirección y aquí aparece el barrio.</div><label>Barrio (se llena solo; corrígelo si hace falta)</label><input id="ubm" maxlength="40" placeholder="Barrio" value="${esc(x?barrioUb(x):'')}"><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="ubBuscar">🔎 Buscar barrio</button></div><br><button class="btn big" data-act="ubicOk">Guardar posición</button>`);if(x&&ubicLimpia(x)&&!barrioUb(x))setTimeout(()=>ACT.ubBuscar(),200)},
async ubBuscar(){const t=($('ut')||{}).value.trim(),n=$('ubb');if(!n)return;if(t.length<5){n.textContent='Escribe la dirección primero.';return}
  n.textContent='Buscando el barrio…';let r=null;try{r=await buscaBarrio(t)}catch(e){n.textContent='No se pudo consultar (sin internet). Escribe el barrio a mano.';return}
  if(($('ut')||{}).value.trim()!==t)return;EM.bar=r?{t,...r}:null;
  if(!r){n.textContent='No encontré esa dirección. Escribe el barrio a mano si lo conoces.';return}
  if(r.ll)GEO[geoK(t)]={ll:r.ll};try{LS('em_geo',JSON.stringify(GEO))}catch(e){}
  if(r.barrio){n.innerHTML='🏘 Barrio: <b>'+esc(r.barrio)+'</b>'+(r.loc?' · '+esc(r.loc):'');const m=$('ubm');if(m&&!m.value)m.value=r.barrio}
  else n.textContent='Ubiqué la dirección'+(r.loc?' ('+r.loc+')':'')+' pero sin barrio. Escríbelo a mano.'},
async ubicOk(){const id=val('ui'),u=$('ut').value.trim().slice(0,115),m=(($('ubm')||{}).value||'').trim().slice(0,40);closeModal();await accion({id,ubicacion:u?u+(m?' [Barrio: '+m+']':''):''})},
async notaOk(){const id=val('ni'),n=$('nt').value,x=EM.d.items.find(i=>i.ID===id);closeModal();await accion({id,nota:armaNota(n,x?tagDe(x):null)})},
dia(d){S.fecha=sumaDias(S.fecha,+d.d);S.fechaSet=hoyL();save();inicio()},
irdia(d){S.fecha=sumaDias(hoyL(),+d.d);S.fechaSet=hoyL();save();inicio()},
modo(d){$('modo1').style.display=d.m==='1'?'':'none';$('modo2').style.display=d.m==='2'?'':'none';$('m1').className=d.m==='1'?'on':'';$('m2').className=d.m==='2'?'on':''},
elegir(){$('pf').click()},
tema(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;LS('em_th',t);if(MAP){MAP.remove();MAP=null}if(EM.d)pinta()},
limpiar(){EM.f='todos';EM.l='';EM.t='';pinta()},
ir(d){EM.v='lista';EM.f='todos';EM.l='';EM.q='';EM.abre={done:true,lleg:true};pinta();const e=$('v-'+d.id);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1600)}},
correo(){if(!S.puente){toast('Primero configura el puente en ⚙ Ajustes',true);return ACT.claves()}traerCorreo(false)},
gpu(){const u=val('pu'),k=$('pk').value.trim();if(!urlOk(u))return toast('Enlace del puente no válido',true);if(k.length<8)return toast('La clave del puente debe tener mínimo 8 caracteres',true);S.puente={url:u,k};save();closeModal();toast('Puente guardado');EM.autoT=0;carga()},
async cargarPF(d){
  if(!PF.rows.length)return toast('Primero elige el archivo',true);
  if(!Object.values(PF.sel).some(Boolean))return toast('Marca al menos una columna',true);
  if(d.rep==='1'&&!confirm('Se borra la lista de ese día (con sus marcas) y se carga la nueva. ¿Continuar?'))return;
  S.ocultas=Object.keys(PF.sel).filter(i=>!PF.sel[i]).map(i=>norm(PF.head[i]));save();
  if(await enviaCarga(textoPF(),true,d.rep==='1')){PF.rows=[];$('pv').innerHTML='';$('pf').value='';const ad=$('adm');if(ad)ad.open=false}
},
async cargar(d){const t=$('tx').value;if(!t.trim())return toast('Pega primero la lista',true);
 if(d.rep==='1'&&!confirm('Se borra la lista de ese día (con sus marcas) y se carga la nueva. ¿Continuar?'))return;
 if(await enviaCarga(t,$('enc').checked,d.rep==='1'))$('tx').value=''},
async borrar(){if(!confirm('¿Borrar toda la lista de este día?'))return;try{EM.d=await api('borrar',{fecha:S.fecha});pinta();toast('Día borrado')}catch(e){toast(e.message,true)}},
copiar(){const l=enlace();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(l).then(()=>toast('Enlace copiado. Envíaselo a los coordinadores'),()=>prompt('Copia este enlace:',l));else prompt('Copia este enlace:',l)},
wa(){window.open('https://wa.me/?text='+encodeURIComponent('Seguimiento operación destinos: '+enlace()),'_blank')},
claves(){modal(`<h2 style="margin-top:0">Ajustes</h2><label>Clave de los coordinadores REPCO (la usan todos; mínimo 4)</label><input id="cs"><br><br><button class="btn big" data-act="gcs">Guardar clave de coordinadores</button><label style="margin-top:16px">Cambiar mi clave de administrador (mínimo 6)</label><input id="ca"><br><br><button class="btn ghost big" data-act="gca">Guardar mi clave</button><label style="margin-top:16px">Puente de correo: enlace del script “PUENTE CORREO EMBALAJES” (termina en /exec)</label><input id="pu" value="${esc(S.puente&&S.puente.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"><label>Clave del puente (la que está en el script)</label><input id="pk" type="password" value="${esc(S.puente&&S.puente.k||'')}"><br><br><button class="btn ghost big" data-act="gpu">Guardar puente</button><p class="mut">Se guarda solo en este dispositivo.</p>`)},
miclave(){modal(`<h2 style="margin-top:0">Cambiar mi clave</h2><label>Clave actual</label><input id="mc0" type="password" autocomplete="current-password"><label>Clave nueva (mínimo 4)</label><input id="mc1" type="password" autocomplete="new-password"><label>Repite la clave nueva</label><input id="mc2" type="password" autocomplete="new-password"><br><br><button class="btn big" data-act="gmc">Guardar mi clave</button>`)},
async gmc(){try{const a=val('mc0'),n=val('mc1');if(n.length<4)throw new Error('Mínimo 4 caracteres');if(n!==val('mc2'))throw new Error('Las claves no coinciden');await api('cambiarClaveSargento',{actual:a,clave:n});closeModal();toast('Tu clave quedó cambiada')}catch(e){toast(e.message,true)}},
async gcs(){try{await api('ponerClaveSargentos',{clave:val('cs')});closeModal();toast('Clave de coordinadores guardada')}catch(e){toast(e.message,true)}},
async gca(){try{if(val('ca').length<6)throw new Error('Mínimo 6 caracteres');await api('cambiarClaveAdmin',{clave:val('ca')});closeModal();toast('Clave guardada')}catch(e){toast(e.message,true)}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset)}});
document.addEventListener('input',e=>{if(e.target.id==='q'&&EM.d){EM.q=e.target.value;$('lista').innerHTML=listaHtml();if(EM.v==='mapa')pintaMapa()}});
let UBT=0;document.addEventListener('input',e=>{if(e.target&&e.target.id==='ut'){clearTimeout(UBT);const m=$('ubm');if(m&&EM.bar&&EM.bar.t!==e.target.value.trim()){}UBT=setTimeout(()=>ACT.ubBuscar(),1300)}});
document.addEventListener('toggle',e=>{const t=e.target;if(t&&t.matches&&t.matches('details.done')&&t.dataset.k)EM.abre[t.dataset.k]=t.open},true);
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fl'){EM.l=t.value;pinta()}
  else if(t.id==='ft'){EM.t=t.value;pinta()}
  else if(t.id==='fd'){S.fecha=t.value||hoyL();S.fechaSet=hoyL();save();inicio()}
  else if(t.id==='pf')leerArchivo(t.files[0]);
  else if(t.id==='hsel')hoja(t.value);
  else if(t.dataset&&t.dataset.col!==undefined){PF.sel[t.dataset.col]=t.checked;pintaPF()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lc')entrar()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token)carga()});
if(!S.api){$('root').innerHTML=`<header>${LOGO}<h1>Seguimiento operación destinos</h1></header><main><div class="card"><h2>Enlace del sistema</h2><p class="mut">Pega el enlace que termina en /exec.</p><input id="au" placeholder="https://script.google.com/macros/s/…/exec"><br><br><button class="btn big" data-act="gu">Guardar</button></div></main>`;ACT.gu=()=>{const u=val('au');if(!urlOk(u))return toast('Enlace no válido',true);S.api=u;save();location.reload()}}
else inicio();
</script>
