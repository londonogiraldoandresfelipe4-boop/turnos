<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("em_th")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Seguimiento de llamadas</title>
<meta name="theme-color" content="#161d27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root,:root[data-theme=dark]{--bg:#161d27;--bg2:#1c2531;--card:#222d3b;--card2:#2a3748;--line:#364559;--tx:#eef3f9;--mut:#9db0c6;--acc:#ffc400;--acctx:#1a1400;--pri:#3d8fe0;--ok:#34d27b;--okbg:#143827;--warn:#ffc400;--warnbg:#3a3010;--bad:#ff6a5e;--badbg:#44201f;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.28)}
:root[data-theme=light]{--bg:#e6ebf1;--bg2:#fff;--card:#fff;--card2:#f1f5f9;--line:#cdd6e1;--tx:#122032;--mut:#58697e;--acc:#ffc400;--acctx:#1a1400;--pri:#1769c2;--ok:#138a4a;--okbg:#dff3e7;--warn:#d99a00;--warnbg:#fff1c7;--bad:#d6382c;--badbg:#fde4e1;--sh:0 1px 2px rgba(18,32,50,.08),0 4px 14px rgba(18,32,50,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{background:var(--bg2);color:var(--tx);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
header h1{font:700 19px/1.1 'Barlow Condensed','Barlow',sans-serif;margin:0;flex:1;letter-spacing:.3px}header small{display:block;font:400 12px 'Barlow',sans-serif;color:var(--mut);letter-spacing:0;margin-top:1px}
header button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.clk{font:700 20px 'Barlow Condensed',sans-serif;color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:.5px}
main{max-width:1040px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
.card h2{font:700 19px 'Barlow Condensed',sans-serif;margin:0 0 6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600;text-decoration:none;min-height:46px}
.btn.big{width:100%;padding:16px;font-size:18px}.btn.ok{background:var(--ok);color:#06220f}.btn.bad{background:var(--bad)}
:root[data-theme=light] .btn.ok{color:#fff}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--line)}.btn.ghost.badc{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px;min-height:38px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:8px;padding:9px 12px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--acctx)}
.mut{color:var(--mut);font-size:13px}.center{text-align:center}
.banner{padding:10px 14px;border-radius:10px;margin:0 0 12px;font-size:14px;background:var(--badbg);color:var(--bad)}
/* panel del día */
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
.hero-h{display:flex;align-items:flex-end;gap:12px}
.hero-h .dia{font-size:13px;color:var(--mut)}
.hero h2{font:700 24px/1.1 'Barlow Condensed',sans-serif;margin:2px 0 0}
.pct{margin-left:auto;font:700 46px/0.9 'Barlow Condensed',sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}.pct small{font-size:22px}
.convoy{display:flex;gap:3px;height:36px;margin:14px 0 4px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.convoy .seg{all:unset;box-sizing:border-box;flex:1;min-width:4px;border-radius:4px;background:var(--warn);cursor:pointer;transition:transform .15s}
.convoy .seg.ok{background:var(--ok)}.convoy .seg.nc{background:var(--bad)}.convoy .seg:hover{transform:scaleY(1.12)}.convoy .seg:focus-visible{outline:2px solid var(--tx)}
.convoy.go .seg{animation:arr .5s both;animation-delay:calc(var(--i)*20ms)}
@keyframes arr{from{transform:scaleY(.1);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.convoy.go .seg{animation:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:13px;font-weight:600;color:var(--tx);background:var(--card2);border-bottom:4px solid var(--warn)}
.stat b{display:block;font:700 30px/1.05 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.stat.o{border-bottom-color:var(--ok)}.stat.n{border-bottom-color:var(--bad)}.stat.on{background:var(--card);outline:2px solid var(--acc)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{flex:1;min-width:92px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font:700 22px/1.1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}.kpi small{color:var(--mut);font-size:12px}
.sync{margin-top:10px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.tools{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 12px}
@media (min-width:700px){.tools{grid-template-columns:1.4fr 1fr}}
/* tarjeta tipo guía de despacho */
.vc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 10px;box-shadow:var(--sh)}
.vc.ok{border-left-color:var(--ok)}.vc.nc{border-left-color:var(--bad)}
.vc.flash{outline:3px solid var(--acc)}
.vc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plate{background:#ffc400;color:#111;border:2px solid #111;border-radius:6px;padding:0 10px;font:700 24px/1.25 'Barlow Condensed',sans-serif;letter-spacing:1.5px}
.stamp{border-radius:6px;padding:2px 9px;font-weight:700;font-size:13px;border:1.5px solid currentColor}
.stamp.s-pend{color:var(--warn)}.stamp.s-ok{color:var(--ok)}.stamp.s-nc{color:var(--bad)}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--mut);font-weight:600;margin-left:auto}
.ruta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 2px}
.ruta span{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:14px}
.ruta i{width:14px;height:2px;background:var(--mut);position:relative;opacity:.7}.ruta i::after{content:'';position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left:6px solid var(--mut);border-right:0}
.mets{display:flex;gap:18px;margin:8px 0 2px}.mets div{display:flex;align-items:baseline;gap:5px}.mets b{font:700 26px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}.mets small{color:var(--mut);font-size:13px}
.gente{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin:8px 0 2px;padding-top:8px;border-top:1px dashed var(--line)}
.gente small,.kv small{display:block;font-size:12px;color:var(--mut)}.gente span,.kv span{font-size:15px;word-break:break-word}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 12px;margin:6px 0}
.quien{font-size:13px;color:var(--mut);margin-top:8px}
.nota{margin-top:6px;font-size:14px;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts .main{flex:1;min-width:120px}
.gh{display:flex;align-items:center;gap:10px;margin:16px 2px 8px}.gh h3{margin:0;font:700 20px 'Barlow Condensed',sans-serif;flex:1}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin:6px 0;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.gh .bar{width:90px;margin:0}
/* resumen */
.grid2{display:grid;grid-template-columns:1fr;gap:12px}@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.hrs{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}.hrs div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.hrs i{display:block;background:var(--pri);border-radius:4px 4px 0 0;min-height:3px;width:100%;max-width:36px;margin:0 auto}.hrs b{font-size:12px;color:var(--tx)}
.lin{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.lin:last-child{border:0}.lin>span:first-child{flex:1;min-width:0}.lin .bar{width:80px;margin:0}.num{font:700 17px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.hora{font:700 16px 'Barlow Condensed',sans-serif;color:var(--acc);width:46px}
details.card>summary{cursor:pointer;font:700 19px 'Barlow Condensed',sans-serif;list-style:none;display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'▾';margin-left:auto;color:var(--mut)}details[open].card>summary::after{content:'▴'}
.drop{border:2px dashed var(--acc);border-radius:12px;padding:18px;text-align:center;color:var(--acc);font-weight:700;background:transparent;width:100%}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cols label{display:inline-flex;align-items:center;gap:6px;margin:0;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;color:var(--tx);background:var(--bg)}
.cols input{width:auto;padding:0}
.pv{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}.pv table{border-collapse:collapse;font-size:12px;white-space:nowrap}.pv td,.pv th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}.pv th{background:var(--bg);color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--card);width:100%;max-width:520px;border-radius:16px;padding:18px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.lbl{background:var(--acc);color:var(--acctx);border-radius:6px;padding:1px 7px;font:700 12px 'Barlow Condensed',sans-serif;white-space:nowrap;border:1.5px solid #111;transform:translate(-50%,-50%)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--tx)}.leaflet-popup-content{font:14px/1.35 'Barlow',sans-serif;min-width:230px;margin:10px}.leaflet-popup-content .vc{margin:0;border:0;box-shadow:none;padding:0;border-left:0}.leaflet-popup-content .acts .btn{min-height:38px;padding:8px 10px;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;display:none;max-width:90%;font-weight:600}
#toast.bad{background:var(--bad);color:#fff}
:root[data-theme=light] .clk,:root[data-theme=light] .pct,:root[data-theme=light] .hora{color:#9a6700}
:root[data-theme=light] .stamp.s-pend{color:#8a5a00}
header{flex-wrap:wrap}header h1{flex:1 1 130px;min-width:0}
@media (max-width:480px){header{gap:6px;padding-left:12px;padding-right:12px}header>svg{display:none}header h1{font-size:17px}header button{padding:7px 10px;font-size:13px}.clk{font-size:18px}}
.lg-h h2{font:700 28px/1.05 'Barlow Condensed',sans-serif;margin:0 0 4px}.lg-h{margin:2px 0 14px}
</style>
</head>
<body>
<div id="root"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>{const e=$(id);return e?e.value.trim():''};
const hm=s=>(s||'').slice(11,16);
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const fecha=f=>{if(!f)return'';const d=new Date(f+'T12:00:00Z');return DIAS[d.getUTCDay()]+' '+f.slice(8,10)+'/'+f.slice(5,7)};
const corto=n=>String(n||'').split(' ').slice(0,2).join(' ');
function reloj(){const e=$('clk');if(e)e.textContent=new Date(Date.now()-5*3600*1000).toISOString().slice(11,16)}
const hoyL=()=>new Date(Date.now()-5*3600*1000).toISOString().slice(0,10);
const ahora=()=>new Date(Date.now()-5*3600*1000).toISOString().slice(0,19);
const sumaDias=(f,n)=>{const d=new Date(f+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}
function modal(h){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML='<div>'+h+'</div>';m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){const m=$('modal');if(m)m.remove()}
function descargar(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},500)}

const LOGO=`<svg width="34" height="34" style="flex:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b2545"/><path d="M256 92c-66 0-118 51-118 114 0 84 118 214 118 214s118-130 118-214c0-63-52-114-118-114z" fill="#fff"/><circle cx="256" cy="206" r="78" fill="#188a4b"/><path d="M222 208l26 27 46-54" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="392" cy="392" r="38" fill="#e8a317"/><circle cx="392" cy="392" r="16" fill="#0b2545"/></svg>`;
/* ---- estado y conexión ---- */
let S=(()=>{try{return JSON.parse(LS('em_s'))||{}}catch(e){return{}}})();
const save=()=>LS('em_s',JSON.stringify(S));
const urlOk=u=>/^(https:\/\/script\.google(usercontent)?\.com\/|http:\/\/localhost:)/.test(u||'');
(function(){const m=location.hash.match(/api=([^&]+)/);if(m){const u=decodeURIComponent(m[1]);if(urlOk(u)){S.api=u;save()}history.replaceState(null,'',location.pathname+location.search)}})();
async function api(action,payload,sinToken){
  if(!S.api)throw new Error('Falta el enlace del sistema');
  let r;try{r=await fetch(S.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:sinToken?'':S.token,payload:payload||{}})})}catch(e){const x=new Error('Sin conexión');x.offline=true;throw x}
  const j=await r.json();
  if(!j.ok){if(j.error==='SESION'){salir(true)}throw new Error(j.msg||j.error)}
  return j.data;
}
(async function(){try{const r=await fetch('config.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const c=await r.json();if(urlOk(c&&c.api)&&c.api!==S.api){S.api=c.api;save();location.reload()}}catch(e){}})();

/* ---- login ---- */
let LG={rol:'S',adminCreado:true};
function salir(sil){S.token='';S.rol='';save();clearInterval(salir.t);if(!sil)toast('Sesión cerrada');login()}
async function login(){
  $('root').innerHTML=`<header>${LOGO}<h1>Seguimiento de llamadas<small>Embalajes del día</small></h1></header><main><div class="card" style="margin-top:16px;max-width:460px;margin-left:auto;margin-right:auto"><div class="lg-h"><h2>Control de embalajes</h2><p class="mut" style="margin:0">Seguimiento de llamadas de los vehículos del día.</p></div><div class="seg" id="rt"></div><div id="lb"></div></div></main>`;
  pintaLogin();
  try{const p=await api('ping',{},true);LG.adminCreado=p.adminCreado;pintaLogin()}catch(e){}
}
function pintaLogin(){
  $('rt').innerHTML=[['S','Sargento'],['A','Administrador']].map(([k,n])=>`<button class="${LG.rol===k?'on':''}" data-act="rol" data-r="${k}">${n}</button>`).join('');
  $('lb').innerHTML=LG.rol==='S'
   ?`<label>Tu nombre</label><input id="ln" value="${esc(LS('em_n')||'')}" placeholder="Ej: Sgto. Pérez" autocomplete="name"><label>Clave</label><input id="lc" type="password"><br><br><button class="btn big" data-act="entrar">Entrar</button>`
   :`${LG.adminCreado?'':'<div class="banner" style="background:var(--warnbg);color:#8a5a00;margin-top:12px">Primera vez: la clave que escribas será la clave de administrador (mínimo 6).</div>'}<label>${LG.adminCreado?'Clave de administrador':'Crea la clave de administrador'}</label><input id="lc" type="password"><br><br><button class="btn big" data-act="entrar">${LG.adminCreado?'Entrar':'Crear y entrar'}</button>`;
}
async function entrar(){
  try{const n=val('ln');if(LG.rol==='S')LS('em_n',n);
    const d=await api(LG.rol==='S'?'loginSargento':'loginAdmin',{nombre:n,clave:$('lc').value},true);
    S.token=d.token;S.rol=d.rol;S.nombre=d.nombre;save();inicio()}catch(e){toast(e.message,true)}
}

/* ---- ubicación por localidad (centros aproximados) ---- */
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const LOC={'Usaquén':[4.7500,-74.0310],'Chapinero':[4.6500,-74.0560],'Santa Fe':[4.6050,-74.0650],'San Cristóbal':[4.5650,-74.0850],'Usme':[4.4700,-74.1200],'Tunjuelito':[4.5800,-74.1330],'Bosa':[4.6050,-74.1900],'Kennedy':[4.6300,-74.1500],'Fontibón':[4.6700,-74.1450],'Engativá':[4.7000,-74.1100],'Suba':[4.7400,-74.0900],'Barrios Unidos':[4.6700,-74.0800],'Teusaquillo':[4.6350,-74.0900],'Los Mártires':[4.6050,-74.0850],'Antonio Nariño':[4.5900,-74.1000],'Puente Aranda':[4.6150,-74.1100],'La Candelaria':[4.5950,-74.0730],'Rafael Uribe Uribe':[4.5600,-74.1100],'Ciudad Bolívar':[4.5400,-74.1600],'Sumapaz':[4.30,-74.25],
 'Soacha':[4.5790,-74.2160],'Funza':[4.7160,-74.2120],'Mosquera':[4.7060,-74.2300],'Madrid':[4.7320,-74.2650],'Cota':[4.8110,-74.1000],'Chía':[4.8620,-74.0580],'Cajicá':[4.9180,-74.0280],'Zipaquirá':[5.0220,-74.0050],'Facatativá':[4.8140,-74.3550],'Tocancipá':[4.9650,-73.9120],'Sopó':[4.9060,-73.9410],'La Calera':[4.7200,-73.9690],'Bogotá':[4.6097,-74.0817]};
const LOCN=Object.keys(LOC).map(n=>[norm(n),n]).sort((a,b)=>b[0].length-a[0].length);
function buscaLoc(txt){const t=' '+norm(txt)+' ';for(const [k,n] of LOCN){if(k!=='bogota'&&t.includes(' '+k+' '))return n}return t.includes(' bogota ')?'Bogotá':''}
const PLACA_RE=/[A-Za-z]{3}\s?-?\s?\d{3}/;
function analiza(det,enc){
  const c=det.split(' | '),h=enc?enc.split(' | '):[];
  const hi=re=>h.findIndex(x=>re.test(norm(x)));
  const col=re=>{const i=hi(re);return i>=0?c[i]||'':''};
  let loc=buscaLoc(col(/localidad|municipio|ciudad/));if(!loc)loc=buscaLoc(c.join(' '));
  let pi=hi(/placa|vehiculo/),placa=pi>=0?(c[pi]||''):'';
  if(!PLACA_RE.test(placa)){const m=det.match(/\b[A-Za-z]{3}\s?-?\s?\d{3}\b/);if(m){placa=m[0].toUpperCase().replace(/[\s-]/g,'');pi=c.findIndex(v=>v.includes(m[0]))}else{pi=-1}}
  let ll=null;const g=det.match(/(-?\d{1,2}\.\d{3,})\s*[,;|\s]\s*(-?\d{2,3}\.\d{3,})/);if(g){const a=+g[1],b=+g[2];if(a>-5&&a<14&&b<-60&&b>-82)ll=[a,b]}
  let tel=col(/tel|cel|movil|contacto/);if(!/\d{7,}/.test(tel)){const t=det.match(/\b3\d{9}\b/);tel=t?t[0]:''}
  let td=tel.replace(/\D/g,'');if(td.length<7)td='';else if(td.length===10)td='+57'+td;else if(td.length===12&&td.startsWith('57'))td='+'+td;
  return{loc,placa,pi,ll,tel:td,conductor:col(/conductor/),cells:c,h};
}

const vacio=v=>{v=String(v||'').trim();return !v||v==='-'};
function num(s){s=String(s||'').replace(/[^\d.,-]/g,'');if(!s)return 0;
  if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isNaN(n)?0:n}
const fmt=n=>(Math.round(n*10)/10).toLocaleString('es-CO');
/* datos de cada vehículo según los títulos de las columnas */
function partes(x){
  if(x._p)return x._p;
  const a=A(x),c=a.cells,h=a.h,u=new Set();
  const get=re=>{const i=h.findIndex(t=>re.test(norm(t)));if(i>=0)u.add(i);return i>=0&&!vacio(c[i])?c[i]:''};
  u.add(a.pi>=0?a.pi:0);
  const p={placa:a.placa||c[0]||'—',loc:a.loc,peso:get(/peso/),pedidos:get(/pedido|factura/),conductor:get(/conductor/),auxiliar:get(/auxiliar/),escolta:get(/escolta/),barrios:[]};
  h.forEach((t,i)=>{if(/barrio/.test(norm(t))){u.add(i);if(!vacio(c[i]))p.barrios.push(c[i])}else if(a.loc&&/^localidad$/.test(norm(t)))u.add(i)});
  p.otros=c.map((v,i)=>u.has(i)||vacio(v)?'':`<div><small>${esc(h[i]||'')}</small><span>${esc(v)}</span></div>`).join('');
  return x._p=p;
}

}
const ORD={pend:0,nc:1,ok:2};
function filtrados(){const d=EM.d,q=EM.q.toLowerCase();

function metricas(d){

function soporte(){
  const d=EM.d;if(!d||!d.total)return toast('No hay datos',true);
  const h=d.encabezado?d.encabezado.split(' | '):[];const an=d.items.map(x=>analiza(x.Detalle,d.encabezado));
  const nc=Math.max(h.length,...d.items.map(x=>x.Detalle.split(' | ').length));
  const orig=Array.from({length:nc},(_,i)=>h[i]||'Dato '+(i+1));
  const cab=['N°','Fecha','Placa','Localidad (detectada)','Latitud aprox.','Longitud aprox.','Ver en mapa',...orig,'Estado','Resultado','Llamado por','Fecha y hora de la llamada','Nota'];
  const filas=d.items.map((x,i)=>{const a=an[i],ll=a.ll||(a.loc?LOC[a.loc]:null),c=x.Detalle.split(' | ');
    return [i+1,d.fecha,a.placa,a.loc,ll?ll[0]:'',ll?ll[1]:'',ll?`https://www.google.com/maps?q=${ll[0]},${ll[1]}`:'',...orig.map((_,k)=>c[k]||''),TXT[stOf(x)],x.Llamado==='SI'?x.Resultado:'',x.LlamadoPor,x.LlamadoEn,x.Nota]});
  const cnt=a=>{const o={ok:0,nc:0,pend:0};a.forEach(x=>o[stOf(x)]++);return o};
  const T=cnt(d.items),ll=d.items.filter(x=>x.LlamadoEn).map(x=>x.LlamadoEn).sort();
  const res=[['SOPORTE DE SEGUIMIENTO DE LLAMADAS — EMBALAJES'],['Fecha',d.fecha],['Generado',new Date().toLocaleString('es-CO')],[],['Total embalajes',d.total],['Llamados (contestaron)',T.ok],['No contestaron',T.nc],['Pendientes',T.pend],['% gestionado',d.total?Math.round((T.ok+T.nc)*100/d.total)+'%':''],['Primera llamada',ll[0]||''],['Última llamada',ll[ll.length-1]||''],[],['POR SARGENTO','Llamados','No contestó']];
  const ps={};d.items.filter(x=>x.Llamado==='SI').forEach(x=>{const p=ps[x.LlamadoPor]=ps[x.LlamadoPor]||[0,0];stOf(x)==='nc'?p[1]++:p[0]++});Object.keys(ps).forEach(k=>res.push([k,ps[k][0],ps[k][1]]));
  res.push([],['POR LOCALIDAD','Total','Llamados','No contestó','Pendientes']);
  const pl={};d.items.forEach((x,i)=>{const k=an[i].loc||'Sin ubicar';(pl[k]=pl[k]||[]).push(x)});Object.keys(pl).sort().forEach(k=>{const c=cnt(pl[k]);res.push([k,pl[k].length,c.ok,c.nc,c.pend])});

    s1['!cols']=cab.map((c,i)=>({wch:i===6?14:Math.min(32,Math.max(10,String(c).length+2))}));s2['!cols']=[{wch:30},{wch:14},{wch:14},{wch:14},{wch:14}];
    s1['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:filas.length,c:cab.length-1}})};
    XLSX.utils.book_append_sheet(w,s1,'Seguimiento');XLSX.utils.book_append_sheet(w,s2,'Resumen');XLSX.writeFile(w,nom+'.xlsx');
  }else{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';descargar(nom+'.csv','﻿'+[cab,...filas].map(r=>r.map(q).join(';')).join('\n'));toast('Se descargó en CSV (sin Excel por falta de internet)')}
}
/* ---- carga desde la Proyectada (Excel) ---- */
const PF={wb:null,nombre:'',hoja:'',head:[],rows:[],sel:{}};
function leerArchivo(f){
  if(!f)return;
  if(typeof XLSX==='undefined')return toast('Se necesita internet para leer el Excel',true);
  const r=new FileReader();
  r.onload=()=>{try{PF.wb=XLSX.read(new Uint8Array(r.result),{type:'array'});PF.nombre=f.name;
    hoja(mejorHoja())}catch(e){toast('No se pudo leer el archivo',true)}};
  r.onerror=()=>toast('No se pudo abrir el archivo',true);
  r.readAsArrayBuffer(f);
}
function parseHoja(nombre){
  const m=XLSX.utils.sheet_to_json(PF.wb.Sheets[nombre],{header:1,raw:false,defval:''}).map(r=>r.map(c=>String(c==null?'':c).replace(/\s+/g,' ').trim()));
  const tope=Math.min(m.length,30);let hi=-1;
  for(let i=0;i<tope;i++){if(m[i].some(c=>/^placa/.test(norm(c)))&&m[i].filter(Boolean).length>=2){hi=i;break}}
  if(hi<0){let best=0;for(let i=0;i<tope;i++){const n=m[i].filter(Boolean).length;if(n>best){best=n;hi=i}}}
  if(hi<0)hi=0;
  const ncol=Math.max(0,...m.map(r=>r.length)),head=Array.from({length:ncol},(_,i)=>m[hi]?m[hi][i]||'':'');
  const pi=head.findIndex(c=>/^placa|vehiculo/.test(norm(c)));
  let rows=m.slice(hi+1).filter(r=>pi>=0?PLACA_RE.test(r[pi]||''):r.filter(Boolean).length>=2);
  rows=rows.filter(r=>!/^total/.test(norm(r.find(Boolean)||'')));
  head.forEach((c,i)=>{if(!c&&i>0&&/barrio 2/.test(norm(head[i-1]))&&rows.some(r=>r[i]))head[i]='Escolta'});
  return{head,rows,pi};
}
/* elige la hoja con una fila por placa (la tabla por vehículo) */
function mejorHoja(){
  let best=null,bs=-1;
  PF.wb.SheetNames.forEach(n=>{try{const p=parseHoja(n);if(!p.rows.length||p.pi<0)return;
    const u=new Set(p.rows.map(r=>norm(r[p.pi]))).size/p.rows.length;
    const s=u+(/proyect/i.test(n)?1:0)+(/dinam|resumen/i.test(n)?.5:0);
    if(s>bs){bs=s;best=n}}catch(e){}});
  return best||PF.wb.SheetNames.find(n=>/proyect/i.test(n))||PF.wb.SheetNames[0];
}
function hoja(nombre){
  PF.hoja=nombre;const p=parseHoja(nombre);PF.head=p.head;PF.rows=p.rows;PF.sel={};
  const oc=S.ocultas||[];
  p.head.forEach((c,i)=>{if(p.rows.some(r=>r[i]))PF.sel[i]=!oc.includes(norm(c))});
  pintaPF();
}
function pintaPF(){
  const w=$('pv');if(!w)return;
  const cols=Object.keys(PF.sel).map(Number);
  if(!PF.rows.length){w.innerHTML=`<div class="banner" style="margin-top:10px">No encontré vehículos en la hoja “${esc(PF.hoja)}”. Revisa que tenga una columna de placas${PF.wb&&PF.wb.SheetNames.length>1?' o elige otra hoja':''}.</div>${selHoja()}`;return}
  const on=cols.filter(i=>PF.sel[i]);
  w.innerHTML=`<div class="mut" style="margin-top:10px">📎 ${esc(PF.nombre)}</div>${selHoja()}
   <p style="margin:8px 0 2px"><b>${PF.rows.length} vehículos</b> listos para cargar. Marca las columnas que quieres que vean los sargentos:</p>
   <div class="cols">${cols.map(i=>`<label><input type="checkbox" data-col="${i}" ${PF.sel[i]?'checked':''}>${esc(PF.head[i]||'Dato '+(i+1))}</label>`).join('')}</div>
   <div class="pv"><table><tr>${on.map(i=>`<th>${esc(PF.head[i]||'Dato '+(i+1))}</th>`).join('')}</tr>${PF.rows.slice(0,4).map(r=>`<tr>${on.map(i=>`<td>${esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</table></div>
   <div class="row" style="margin-top:12px"><button class="btn ok grow" data-act="cargarPF" data-rep="0">➕ Agregar al día</button><button class="btn ghost grow" data-act="cargarPF" data-rep="1">♻ Reemplazar el día</button></div>
   <p class="mut" style="margin:8px 0 0">“Agregar” suma lo nuevo sin tocar lo ya marcado (omite repetidos). “Reemplazar” borra ese día y lo carga de nuevo.</p>`;
}
function selHoja(){const ns=PF.wb?PF.wb.SheetNames:[];return ns.length>1?`<label>Hoja del libro</label><select id="hsel">${ns.map(n=>`<option ${n===PF.hoja?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
function textoPF(){
  const c=Object.keys(PF.sel).map(Number).filter(i=>PF.sel[i]);
  const lim=v=>String(v||'-').replace(/[\t\r\n|]+/g,' ').trim()||'-';
  return [c.map(i=>lim(PF.head[i]||'Dato '+(i+1))).join('\t'),...PF.rows.map(r=>c.map(i=>lim(r[i])).join('\t'))].join('\n');
}
async function enviaCarga(texto,enc,rep){
  try{const r=await api('cargar',{fecha:S.fecha,texto,encabezado:enc,reemplazar:rep});EM.d=r;EM.vio=false;pinta();toast('Cargados. Total del día: '+r.total+(r.omitidos?' ('+r.omitidos+' repetidos omitidos)':''));return true}catch(e){toast(e.message,true);return false}
}
/* ---- puente de correo (Gmail → app) ---- */
async function puenteGet(params){
  const c=S.puente;if(!c||!c.url||!c.k)throw new Error('Falta configurar el puente de correo (⚙ Ajustes)');
  const q=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
  let r;try{r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'k='+encodeURIComponent(c.k)+'&'+q)}catch(e){throw new Error('Sin conexión con el puente de correo')}
  let j;try{j=await r.json()}catch(e){throw new Error('El puente no respondió bien. Revisa el enlace en Ajustes')}
  if(!j.ok)throw new Error(j.error||'Error del puente');return j;
}
async function traerCorreo(auto){
  if(typeof XLSX==='undefined'){if(!auto)toast('Se necesita internet para leer el Excel',true);return}
  EM.autoT=Date.now();
  try{
    if(!auto)toast('Buscando en el correo…');
    const n=await puenteGet({accion:'novedades'});
    const del=n.items.filter(x=>x.fecha===S.fecha);
    const it=del.find(x=>x.tipo==='proy')||del.find(x=>x.tipo==='ejec');
    if(!it)throw new Error('Aún no llega el correo de EMBALAJES del '+fecha(S.fecha));
    const a=await puenteGet({id:it.id});
    const bin=atob(a.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    PF.wb=XLSX.read(u,{type:'array'});PF.nombre=a.asunto||a.nombre;hoja(mejorHoja());
    if(!PF.rows.length)throw new Error('El Excel del correo no trae vehículos reconocibles');
    EM.nota='';
    if(auto){if(await enviaCarga(textoPF(),true,false)){toast('Se cargaron '+PF.rows.length+' vehículos desde el correo');PF.rows=[];const v=$('pv');if(v)v.innerHTML=''}}
    else{const ad=$('adm');if(ad)ad.open=true;ACT.modo({m:'1'});toast('Correo leído: revisa las columnas y carga')}
  }catch(e){if(auto){EM.nota=e.message;if(EM.d&&!EM.d.total)pinta()}else toast(e.message,true)}
}
/* ---- enlace para los sargentos ---- */
const enlace=()=>location.href.split('#')[0].split('?')[0]+'#api='+encodeURIComponent(S.api||'');
async function carga(){if(!S.token)return;try{EM.d=await api('listar',{fecha:S.rol==='A'?S.fecha:undefined});EM.sync=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false});pinta();if(S.rol==='A'&&S.puente&&EM.d.total===0&&Date.now()-EM.autoT>300000)traerCorreo(true)}catch(e){if(!EM.d&&$('res'))$('res').innerHTML=`<div class="banner">${esc(e.offline?'Sin conexión. Reintentando…':e.message)}</div>`}}
async function accion(p){
  const x=p.id&&EM.d?EM.d.items.find(i=>i.ID===p.id):null;
  if(x){if(p.deshacer){x.Llamado='';x.Resultado='';x.LlamadoPor='';x.LlamadoEn=''}else if(p.resultado){x.Llamado='SI';x.Resultado=p.resultado;x.LlamadoPor=S.nombre||'';x.LlamadoEn=ahora()}if(p.nota!==undefined)x.Nota=p.nota;pinta()}
  try{EM.d=await api('marcar',Object.assign({fecha:S.rol==='A'?S.fecha:undefined},p));pinta()}catch(e){toast(e.message,true);carga()}
}
function inicio(){
  if(!S.token)return login();
  if(MAP){MAP.remove();MAP=null}EM.d=null;EM.f='todos';EM.q='';EM.v='lista';EM.vio=false;EM.autoT=0;EM.nota='';
  if(!S.fecha||S.fechaSet!==hoyL()){S.fecha=hoyL();S.fechaSet=hoyL();save()}
  const adm=S.rol==='A';
  $('root').innerHTML=`<header>${LOGO}<h1>Seguimiento de llamadas<small>${esc(S.nombre||'')}</small></h1><span class="clk" id="clk"></span><button data-act="tema" aria-label="Cambiar entre tema claro y oscuro">Tema</button>${adm?'<button data-act="claves">Ajustes</button>':''}<button data-act="salir">Salir</button></header><main>${adm?panelAdmin():''}<div id="res"><div class="card mut">Cargando…</div></div></main>`;
  reloj();clearInterval(salir.c);salir.c=setInterval(reloj,30000);EM.anim=false;carga();clearInterval(salir.t);salir.t=setInterval(()=>{if(!$('modal')&&!document.querySelector('.leaflet-popup')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))carga()},20000);
}
function panelAdmin(){return `<details class="card" id="adm" open><summary>📥 Cargar embalajes del día</summary>
 <label>Día de los embalajes</label>
 <div class="row"><button class="btn ghost sm" data-act="dia" data-d="-1">‹</button><input type="date" id="fd" value="${S.fecha}" class="grow" style="width:auto"><button class="btn ghost sm" data-act="dia" data-d="1">›</button></div>
 <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="irdia" data-d="0">Hoy</button><button class="btn ghost sm" data-act="irdia" data-d="1">Mañana</button><span class="mut">La Proyectada se hace el día anterior: carga “Mañana”.</span></div>
 <div class="seg" style="margin-top:14px"><button class="on" id="m1" data-act="modo" data-m="1">📎 Subir Excel</button><button id="m2" data-act="modo" data-m="2">📋 Pegar</button></div>
 <div id="modo1" style="margin-top:12px"><button class="btn ghost big" data-act="correo" style="margin-bottom:10px">📧 Traer del correo (Centro Control)</button><button class="drop" data-act="elegir">📎 Elegir la Proyectada (Excel)</button><input type="file" id="pf" accept=".xlsx,.xls,.xlsm,.csv" style="display:none"><div id="pv"></div></div>
 <div id="modo2" style="display:none;margin-top:12px"><p class="mut" style="margin:0 0 8px">Copia las filas desde Excel y pégalas aquí. Los sargentos las ven al instante.</p>
 <textarea id="tx" rows="6" placeholder="Pega aquí la lista…"></textarea>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="enc" style="width:auto"> La primera línea son los títulos de las columnas</label>
 <div class="row" style="margin-top:10px"><button class="btn ok grow" data-act="cargar" data-rep="0">➕ Agregar al día</button><button class="btn ghost grow" data-act="cargar" data-rep="1">♻ Reemplazar el día</button></div></div>
 <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
 <div class="row"><button class="btn ghost sm" data-act="copiar">🔗 Copiar enlace para sargentos</button><button class="btn ghost sm" data-act="wa">💬 WhatsApp</button><button class="btn ghost sm badc" data-act="borrar" style="margin-left:auto">🗑 Borrar el día</button></div></details>`}

const ACT={
rol(d){LG.rol=d.r;pintaLogin()},entrar,salir(){salir()},
filtro(d){EM.f=EM.f===d.f&&d.f!=='todos'?'todos':d.f;pinta()},
vista(d){EM.v=d.v;pinta();if(d.v==='mapa')setTimeout(()=>MAP&&MAP.invalidateSize(),50)},soporte,
marca(d){accion({id:d.id,resultado:d.r||'Llamado'})},
des(d){accion({id:d.id,deshacer:true})},
nota(d){const x=EM.d.items.find(i=>i.ID===d.id);modal(`<h2 style="margin-top:0">Nota</h2><input type="hidden" id="ni" value="${esc(d.id)}"><textarea id="nt" rows="3" maxlength="200" placeholder="Ej: pidió que lo llamen a las 3 pm">${esc(x&&x.Nota||'')}</textarea><br><br><button class="btn big" data-act="notaOk">Guardar</button>`)},
async notaOk(){const id=val('ni'),n=$('nt').value;closeModal();await accion({id,nota:n})},
dia(d){S.fecha=sumaDias(S.fecha,+d.d);S.fechaSet=hoyL();save();inicio()},
irdia(d){S.fecha=sumaDias(hoyL(),+d.d);S.fechaSet=hoyL();save();inicio()},
modo(d){$('modo1').style.display=d.m==='1'?'':'none';$('modo2').style.display=d.m==='2'?'':'none';$('m1').className=d.m==='1'?'on':'';$('m2').className=d.m==='2'?'on':''},
elegir(){$('pf').click()},
tema(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;LS('em_th',t);if(MAP){MAP.remove();MAP=null}if(EM.d)pinta()},
limpiar(){EM.f='todos';EM.l='';pinta()},
ir(d){EM.v='lista';EM.f='todos';EM.l='';EM.q='';pinta();const e=$('v-'+d.id);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1600)}},
correo(){if(!S.puente){toast('Primero configura el puente en ⚙ Ajustes',true);return ACT.claves()}traerCorreo(false)},
gpu(){const u=val('pu'),k=$('pk').value.trim();if(!urlOk(u))return toast('Enlace del puente no válido',true);if(k.length<8)return toast('La clave del puente debe tener mínimo 8 caracteres',true);S.puente={url:u,k};save();closeModal();toast('Puente guardado');EM.autoT=0;carga()},
async cargarPF(d){
  if(!PF.rows.length)return toast('Primero elige el archivo',true);
  if(!Object.values(PF.sel).some(Boolean))return toast('Marca al menos una columna',true);
  if(d.rep==='1'&&!confirm('Se borra la lista de ese día (con sus marcas) y se carga la nueva. ¿Continuar?'))return;
  S.ocultas=Object.keys(PF.sel).filter(i=>!PF.sel[i]).map(i=>norm(PF.head[i]));save();
  if(await enviaCarga(textoPF(),true,d.rep==='1')){PF.rows=[];$('pv').innerHTML='';$('pf').value='';const ad=$('adm');if(ad)ad.open=false}
},
async cargar(d){const t=$('tx').value;if(!t.trim())return toast('Pega primero la lista',true);
 if(d.rep==='1'&&!confirm('Se borra la lista de ese día (con sus marcas) y se carga la nueva. ¿Continuar?'))return;
 if(await enviaCarga(t,$('enc').checked,d.rep==='1'))$('tx').value=''},
async borrar(){if(!confirm('¿Borrar toda la lista de este día?'))return;try{EM.d=await api('borrar',{fecha:S.fecha});pinta();toast('Día borrado')}catch(e){toast(e.message,true)}},
copiar(){const l=enlace();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(l).then(()=>toast('Enlace copiado. Envíaselo a los sargentos'),()=>prompt('Copia este enlace:',l));else prompt('Copia este enlace:',l)},
wa(){window.open('https://wa.me/?text='+encodeURIComponent('Seguimiento de llamadas de embalajes: '+enlace()),'_blank')},
claves(){modal(`<h2 style="margin-top:0">Ajustes</h2><label>Clave de los sargentos (la usan todos; mínimo 4)</label><input id="cs"><br><br><button class="btn big" data-act="gcs">Guardar clave de sargentos</button><label style="margin-top:16px">Cambiar mi clave de administrador (mínimo 6)</label><input id="ca"><br><br><button class="btn ghost big" data-act="gca">Guardar mi clave</button><label style="margin-top:16px">Puente de correo: enlace del script “PUENTE CORREO EMBALAJES” (termina en /exec)</label><input id="pu" value="${esc(S.puente&&S.puente.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"><label>Clave del puente (la que está en el script)</label><input id="pk" type="password" value="${esc(S.puente&&S.puente.k||'')}"><br><br><button class="btn ghost big" data-act="gpu">Guardar puente</button><p class="mut">Se guarda solo en este dispositivo.</p>`)},
async gcs(){try{await api('ponerClaveSargentos',{clave:val('cs')});closeModal();toast('Clave de sargentos guardada')}catch(e){toast(e.message,true)}},
async gca(){try{if(val('ca').length<6)throw new Error('Mínimo 6 caracteres');await api('cambiarClaveAdmin',{clave:val('ca')});closeModal();toast('Clave guardada')}catch(e){toast(e.message,true)}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset)}});
document.addEventListener('input',e=>{if(e.target.id==='q'&&EM.d){EM.q=e.target.value;$('lista').innerHTML=listaHtml();if(EM.v==='mapa')pintaMapa()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fl'){EM.l=t.value;pinta()}
  else if(t.id==='fd'){S.fecha=t.value||hoyL();S.fechaSet=hoyL();save();inicio()}
  else if(t.id==='pf')leerArchivo(t.files[0]);
  else if(t.id==='hsel')hoja(t.value);
  else if(t.dataset&&t.dataset.col!==undefined){PF.sel[t.dataset.col]=t.checked;pintaPF()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lc')entrar()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token)carga()});
if(!S.api){$('root').innerHTML=`<header>${LOGO}<h1>Seguimiento de llamadas</h1></header><main><div class="card"><h2>Enlace del sistema</h2><p class="mut">Pega el enlace que termina en /exec.</p><input id="au" placeholder="https://script.google.com/macros/s/…/exec"><br><br><button class="btn big" data-act="gu">Guardar</button></div></main>`;ACT.gu=()=>{const u=val('au');if(!urlOk(u))return toast('Enlace no válido',true);S.api=u;save();location.reload()}}
else inicio();
</script>
</body>
</html>
