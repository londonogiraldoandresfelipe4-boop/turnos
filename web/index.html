<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registro de Turnos</title>
<meta name="theme-color" content="#070e1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f2f5f9;--card:#fff;--tx:#0f1b2d;--mut:#5b6b80;--line:#dbe3ee;--pri:#0b2545;--acc:#1f7ae0;--ok:#188a4b;--warn:#c77700;--bad:#c62828;--okbg:#e3f6ea;--warnbg:#fff1d6;--badbg:#fde4e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
header small{display:block;font-weight:400;opacity:.8;font-size:12px}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:12px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 16px;background:var(--acc);color:#fff;font-weight:600;text-align:center;text-decoration:none}
.btn.big{width:100%;padding:20px;font-size:20px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 -4px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--line);color:var(--tx)}
.tp-CARAVANA{--c:#1b9e4b}.tp-TAT{--c:#2f6fdb}.tp-MOVIMIENTO{--c:#0e8f9b}.tp-DISPONIBLE{--c:#d9730d}.tp-CAMBIO{--c:#8a4fd8}
.tb{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.gh{margin:10px 0 2px;padding:6px 10px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:8px;font-weight:700;color:var(--c)}
.gh span{color:var(--tx);font-weight:400}
.lbx{border:1px solid var(--bd,#d0d7e2);border-radius:12px;padding:10px;margin:8px 0}
.lbx.CONFLICTO,.lbx.REVISAR,.lbx.ERROR{border-color:#d9730d;background:#fff4e5;color:#5a2e00}.lbx.DIFERENCIA{border-color:#c9a400;background:#fffbe0;color:#4d4200}
.opx{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:700 11px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.8px;color:#eafff3;background:linear-gradient(110deg,#052e1a 0%,#0a7a42 45%,#052e1a 100%);background-size:220% 100%;border:1px solid #22ff8a;box-shadow:0 0 8px #22ff8a99,inset 0 0 6px #22ff8a55;animation:opxScan 3s linear infinite;white-space:nowrap}
.opx i{width:8px;height:8px;border-radius:50%;background:#22ff8a;box-shadow:0 0 8px #22ff8a;animation:opxPulse 1.2s ease-in-out infinite}
.opx b{color:#22ff8a}
tr.enop>td{background:linear-gradient(90deg,rgba(34,255,138,.16),rgba(34,255,138,.03))}
tr.enop>td:first-child{box-shadow:inset 4px 0 0 #22ff8a}
.opx-cab{margin:10px 0 2px;padding:8px 12px;border-radius:10px;border:1px solid #22ff8a;background:linear-gradient(110deg,#052e1a,#0a7a42 50%,#052e1a);color:#eafff3;font:700 13px ui-monospace,Consolas,monospace;letter-spacing:.8px;box-shadow:0 0 12px #22ff8a66}
@keyframes opxScan{to{background-position:-220% 0}}
@keyframes opxPulse{50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.opx,.opx i{animation:none}}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.big-time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--acc)}.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
.scroll{overflow-x:auto}
.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.banner{padding:10px 14px;border-radius:10px;margin:0 0 12px;font-size:14px}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.ok{background:var(--okbg);color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:18px}}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:99;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#toast div{background:#10243f;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast div.err{background:var(--bad)}
.center{max-width:430px;margin:0 auto}
.pin{letter-spacing:.4em;text-align:center;font-size:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{text-align:center;padding:8px}.kpi b{display:block;font-size:26px}.kpi span{font-size:12px;color:var(--mut)}
code{background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all}
/* ===== CONSOLA DE DESPACHO (rediseño) ===== */
:root{--bg:#050a14;--bg2:#08101f;--card:#0b1426;--tx:#dbe7f5;--mut:#7d92ae;--line:#192a45;--pri:#070e1c;--acc:#35d0ff;--accx:#04141c;--ok:#2fe39a;--warn:#ffb020;--bad:#ff5468;--okbg:rgba(47,227,154,.12);--warnbg:rgba(255,176,32,.13);--badbg:rgba(255,84,104,.14);--glow:0 0 18px rgba(53,208,255,.28);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
html[data-tema=dia]{--bg:#edf2f8;--bg2:#e3eaf3;--card:#fff;--tx:#0d1a2c;--mut:#566a85;--line:#d3deec;--pri:#f9fbfe;--acc:#0a6cff;--accx:#fff;--ok:#0f8a56;--warn:#b86b00;--bad:#c92a3f;--okbg:#e0f6ec;--warnbg:#fff0d2;--badbg:#fde3e6;--glow:0 0 0 transparent;color-scheme:light}
html,body{background:var(--bg);background-image:radial-gradient(1200px 500px at 85% -10%,rgba(53,208,255,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(120,90,255,.09),transparent 60%);background-attachment:fixed}
html[data-tema=dia] body{background-image:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* barra de mando */
header{background:linear-gradient(180deg,var(--pri),var(--bg2));border-bottom:1px solid var(--line);padding-bottom:12px;gap:12px;color:var(--tx)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:barre 6s ease-in-out infinite alternate}
@keyframes barre{from{background-position:-10% 0}to{background-position:110% 0}}
header h1{display:flex;flex-direction:column;font-size:17px;letter-spacing:.01em}
header small{color:var(--mut);opacity:1}
header .led{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none;animation:latido 2s ease-in-out infinite}
header .led.off{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:none}
@keyframes latido{50%{opacity:.35}}
header .reloj{font:600 15px var(--mono);color:var(--acc);text-shadow:var(--glow);font-variant-numeric:tabular-nums;white-space:nowrap}
header .reloj small{display:block;font:400 10px var(--mono);color:var(--mut);text-align:right;text-shadow:none}
header button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 11px;transition:border-color .2s,box-shadow .2s}
header button:hover,header button:focus-visible{border-color:var(--acc);box-shadow:var(--glow)}
main{padding-top:16px}
/* módulos */
.card{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,var(--acc)),var(--card));border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px -14px rgba(0,0,0,.6)}
html[data-tema=dia] .card{background:var(--card);box-shadow:0 6px 18px -12px rgba(11,37,69,.35)}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border:2px solid var(--acc);opacity:.85;transition:width .25s,height .25s}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.card:hover::before,.card:hover::after{width:26px;height:26px}
.card h2{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650;color:var(--tx);text-transform:none;letter-spacing:.01em;margin:0 0 10px}
.card.plegable>h2{cursor:pointer;user-select:none;margin:-4px -6px 8px;padding:4px 6px;border-radius:8px}
.card.plegable>h2:hover{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.card.plegable>h2:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.card.plegable>h2::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.card.plg>h2{margin-bottom:-4px}
.card.plg>h2::after{transform:rotate(-45deg)}
.card.plg>:not(h2){display:none!important}
.card.plegable>h2 .resumen{font:400 12px var(--mono);color:var(--mut);margin-left:4px}
.card.plegable:not(.plg)>:not(h2){animation:abre .22s ease-out}
@keyframes abre{from{opacity:0;transform:translateY(-4px)}}
.modbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;font:12px var(--mono);color:var(--mut)}
.modbar span{flex:1;display:flex;align-items:center;gap:8px}
.modbar span::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.modbar button{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px 10px;font:12px var(--mono)}
.modbar button:hover{border-color:var(--acc)}
/* pestañas segmentadas */
.tabs{gap:4px;padding:4px;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.tabs button{border:0;background:transparent;color:var(--mut);border-radius:8px;padding:9px 14px;position:relative;transition:color .2s,background .2s}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);border:0;box-shadow:inset 0 -2px 0 var(--acc),var(--glow);font-weight:650}
/* controles */
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--tx);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.btn{background:var(--acc);color:var(--accx);border-radius:9px;transition:filter .2s,box-shadow .2s,transform .1s}
.btn:hover{filter:brightness(1.1);box-shadow:var(--glow)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.ok{background:var(--ok);color:#03150d}.btn.bad{background:var(--bad);color:#fff}.btn.warn{background:var(--warn);color:#1a0f00}
html[data-tema=dia] .btn.ok,html[data-tema=dia] .btn.bad{color:#fff}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 60%,transparent)}
.btn.big{font-size:20px;letter-spacing:.02em;box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 50%,transparent),var(--glow)}
.btn.big.ok{box-shadow:0 0 0 1px var(--ok),0 0 26px rgba(47,227,154,.35)}
.btn.big.bad{box-shadow:0 0 0 1px var(--bad),0 0 26px rgba(255,84,104,.35)}
.badge{font-family:var(--mono);font-weight:600;font-size:11.5px;border-radius:6px;background:color-mix(in srgb,var(--mut) 20%,transparent);color:var(--tx)}
.tb{border-radius:6px}
/* datos */
.big-time{font-family:var(--mono);color:var(--acc);text-shadow:var(--glow);letter-spacing:.02em}
.kpi{border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.kpi b{font:700 28px var(--mono);color:var(--acc);text-shadow:var(--glow)}
.bar{height:8px;border-radius:4px;background:var(--bg2);border:1px solid var(--line)}
.bar i{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 40%,#7a5cff));box-shadow:0 0 10px color-mix(in srgb,var(--acc) 60%,transparent)}
th{font-size:11.5px;letter-spacing:.04em;text-transform:none;font-weight:600;font-family:var(--mono)}
tbody tr:hover>td{background:color-mix(in srgb,var(--acc) 6%,transparent)}
td,th{border-bottom-color:var(--line)}
.item{border-bottom-color:var(--line)}
.gh{border-radius:6px;font-family:var(--mono);font-size:13px}
.banner{border-radius:8px;border:1px solid color-mix(in srgb,currentColor 35%,transparent)}
code{background:var(--bg2);border:1px solid var(--line);font-family:var(--mono)}
.lbx{border-color:var(--line);border-radius:8px}
.lbx.CONFLICTO,.lbx.REVISAR,.lbx.ERROR{border-color:var(--warn);background:var(--warnbg);color:var(--tx)}
.lbx.DIFERENCIA{border-color:var(--warn);background:var(--warnbg);color:var(--tx)}
.modal{background:rgba(2,6,14,.72);backdrop-filter:blur(6px)}
.modal>div{background:var(--card);border:1px solid var(--line);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent),0 20px 60px rgba(0,0,0,.6)}
.modal>div h2{font-size:17px;text-transform:none;color:var(--tx)}
#toast div{background:var(--card);color:var(--tx);border:1px solid var(--acc);box-shadow:var(--glow)}
#toast div.err{background:var(--badbg);border-color:var(--bad);color:var(--tx)}
@media (prefers-reduced-motion:reduce){header::after,header .led,.card.plegable:not(.plg)>:not(h2){animation:none}.card::before,.card::after{transition:none}}
@media (max-width:520px){header .reloj small{display:none}main{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= utilidades ================= */
const MEM={};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);return null}catch(e){if(v===undefined)return MEM[k]||null;if(v===null)delete MEM[k];else MEM[k]=v;return null}};
const jp=(s,d)=>{try{return JSON.parse(s)??d}catch(e){return d}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const val=id=>{const e=$(id);return e?e.value.trim():''};
const TIPOS={TAT:'TAT (REPCO)',CARAVANA:'Caravana',MOVIMIENTO:'Movimiento de bodega',DISPONIBLE:'Disponible Prosegur'};
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const pad=n=>String(n).padStart(2,'0');
const naive=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const hoyL=()=>naive().slice(0,10);
const msN=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2})(?::(\d{2}))?)?$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)):NaN};
const addD=(f,n)=>new Date(msN(f)+n*864e5).toISOString().slice(0,10);
const lunes=f=>addD(f,-((new Date(msN(f)).getUTCDay()+6)%7));
const hm=s=>(s||'').slice(11,16);
const fecha=f=>{if(!f)return'';const d=new Date(msN(f));return `${DIAS[d.getUTCDay()]} ${f.slice(8,10)}/${f.slice(5,7)}`};
const fh=h=>{h=+h||0;const m=Math.round(h*60);return `${Math.floor(m/60)} h ${pad(m%60)} min`};
const f1=h=>(+h||0).toFixed(1);
const nombreCorto=n=>{const p=String(n||'').split(' ').filter(Boolean);return p.length>=3?p[0]+' '+p[2]:p.slice(0,2).join(' ')};
function toast(t,err){const d=document.createElement('div');d.textContent=t;if(err)d.className='err';$('toast').appendChild(d);setTimeout(()=>d.remove(),err?6000:3200)}
function modal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML='<div>'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){const m=$('modal');if(m)m.remove()}
function barra(v,tope){const p=Math.min(100,v/tope*100);const c=v>tope?'b':v>tope*0.85?'w':'';return `<div class="bar"><i class="${c}" style="width:${p}%"></i></div>`}
function descargar(nombre,texto,tipo){const b=new Blob([texto],{type:tipo||'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},500)}
function wa(tel,texto){const t=String(tel||'').replace(/\D/g,'');const num=t?(t.length===10?'57'+t:t):'';return `https://wa.me/${num}?text=${encodeURIComponent(texto)}`}
function getPos(ms){return new Promise(res=>{if(!navigator.geolocation)return res({});let hecho=false;const fin=v=>{if(!hecho){hecho=true;res(v)}};setTimeout(()=>fin({}),ms+1500);navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,prec:p.coords.accuracy}),()=>fin({}),{enableHighAccuracy:true,timeout:ms,maximumAge:0})})}
async function notificar(t,b){try{toast(t+(b?': '+b:''));if(navigator.vibrate)navigator.vibrate([200,100,200]);if('Notification' in window&&Notification.permission==='granted'){const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)reg.showNotification(t,{body:b||'',icon:'icon-192.png',badge:'icon-192.png'});else new Notification(t,{body:b||'',icon:'icon-192.png'})}}catch(e){}}

/* ================= estado y API ================= */
let S={api:LS('rt_api')||'',token:'',rol:'',id:'',nombre:'',cfg:{}};
const ses=jp(LS('rt_s'),null);
if(ses&&ses.token){Object.assign(S,ses)}
let Q=jp(LS('rt_q'),[]);
const saveQ=()=>LS('rt_q',JSON.stringify(Q));
const saveS=()=>LS('rt_s',S.token?JSON.stringify({token:S.token,rol:S.rol,id:S.id,nombre:S.nombre,cfg:S.cfg}):null);
let online=true;

async function api(action,payload,publico){
  if(!S.api)throw Object.assign(new Error('Falta el enlace del sistema'),{server:true});
  let r;
  try{
    const resp=await fetch(S.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:publico?'':S.token,payload:payload||{}})});
    r=await resp.json();
  }catch(e){online=false;pintaEstado();throw Object.assign(new Error('Sin conexión'),{offline:true})}
  online=true;pintaEstado();
  if(!r.ok){
    if(r.error==='SESION'){salir(true);throw Object.assign(new Error('Sesión vencida'),{server:true})}
    throw Object.assign(new Error(r.msg||r.error||'Error'),{server:true});
  }
  return r.data;
}

async function accion(action,payload){

    Q.push({action,payload:p,uid:S.id});saveQ();optimista(action,p);pintaEstado();

function optimista(a,p){
  const E=jp(LS('rt_est'),null);if(!E)return;
  if(a==='iniciarTurno')E.turno={ID:'local',Tipo:p.tipo,Vehiculo:(p.vehiculo||'').toUpperCase(),ZonaRuta:(p.zona||'').toUpperCase(),Inicio:naive(new Date(p.ts)),pendiente:true};
  if(a==='cerrarTurno')E.turno=null;
  if(a==='registrarParada')E.paradas.push({Momento:naive(new Date(p.ts)),Tipo:p.tipo,Nota:p.nota});
  if(a==='registrarMovimiento')E.movimientos.push({Momento:naive(new Date(p.ts)),Ruta:p.ruta,Placa:p.placa,Viajes:p.viajes,PesoKg:p.peso});
  E.base=Date.now();E.ahora=naive();LS('rt_est',JSON.stringify(E));EST=E;pintaEsc();
}
let flushing=false;
async function flush(){
  if(flushing||!S.token||S.rol!=='E')return;
  flushing=true;
  try{
    for(const it of Q.slice()){
      if(it.uid!==S.id)continue;
      try{await api(it.action,it.payload);Q.splice(Q.indexOf(it),1);saveQ()}
      catch(e){if(e.offline)break;if(e.server){toast('No se pudo enviar un registro: '+e.message,true);Q.splice(Q.indexOf(it),1);saveQ()}else break}
    }
  }finally{flushing=false;pintaEstado()}
  await cargaEsc(true);
}

const ACT={

libroPintar(e,pr){
  const box=$('libroEstado');if(!box)return;
  const u=e.ultimo||{},est=u.cuando?(u.ok===false?`<div class="banner warn">⚠ Última vez ${esc(u.cuando.slice(5,16))}: ${esc(u.msg||'')}</div>`:`<div class="mut">✅ Última sincronización: ${esc(u.cuando.slice(5,16))}</div>`):'<div class="mut">Aún no se ha sincronizado nada.</div>';
  const c=e.cuenta||{};
  const btn=(clave,a,t,cls)=>`<button class="btn ${cls||'ghost'} sm" data-act="libroAccion" data-clave="${esc(clave)}" data-a="${a}">${t}</button>`;
  const acc=x=>{const t=x.clave.charAt(0)==='T';
    if(x.estado==='CONFLICTO')return t?btn(x.clave,'reemplazar','Es el mismo: usar la hora de la app','ok')+btn(x.clave,'agregar','Es otro servicio: agregar')+btn(x.clave,'ignorar','Ignorar'):btn(x.clave,'reintentar','Reintentar')+btn(x.clave,'ignorar','Ignorar');
    if(x.estado==='REVISAR')return btn(x.clave,'reintentar','Reintentar','ok')+btn(x.clave,'escribir','Escribir tal cual')+btn(x.clave,'ignorar','Ignorar');
    if(x.estado==='DIFERENCIA')return btn(x.clave,'reemplazar','Usar la hora de la app','ok')+btn(x.clave,'dejar','Dejar lo del libro');
    return btn(x.clave,'reintentar','Reintentar','ok')+btn(x.clave,'ignorar','Ignorar')};
  const pend=(e.pendientes||[]).map(x=>`<div class="lbx ${esc(x.estado)}"><b>${esc(x.estado)}</b> · ${esc(x.resumen)}<br><span style="font-size:13px">${esc(x.detalle)}</span><div class="row" style="margin-top:6px;flex-wrap:wrap">${acc(x)}</div></div>`).join('');
  const rec=(e.recientes||[]).map(x=>`<div class="item" style="padding:4px 0;font-size:13px">✅ ${esc(x.resumen)} <span class="mut">→ ${esc(x.hoja)} fila ${esc(x.fila)}</span></div>`).join('');
  let p='';
  if(pr){p=`<div class="banner ok">✅ Conexión correcta con «${esc(pr.libro)}». Última fila TAT: ${esc(pr.ultimaTat)} · filas libres: ${pr.filasLibresTat} · última caravana: ${esc(pr.ultimaCaravana)}.</div>`;
    if((pr.escoltasSinNombreEnLibro||[]).length)p+=`<div class="banner warn"><b>Estos escoltas no coinciden con el nombre del libro:</b>${pr.escoltasSinNombreEnLibro.map(x=>`<div style="margin:6px 0">${esc(x.nombre)}<br>${(x.sugerencias||[]).map(s=>`<button class="btn ghost sm" data-act="libroAlias" data-n="${esc(x.nombre)}" data-l="${esc(s)}">Es ${esc(s)}</button>`).join(' ')||'<span class="mut">No aparece en el maestro del libro: agrégalo en MAESTRO · Cédulas.</span>'}</div>`).join('')}</div>`}
  box.innerHTML=p+est+`<div class="mut">Escritos: ${c.OK||0} · Por revisar: ${(c.CONFLICTO||0)+(c.REVISAR||0)+(c.ERROR||0)+(c.DIFERENCIA||0)} · Ignorados: ${c.IGNORADO||0}</div>`+pend+(rec?`<details style="margin-top:8px"><summary class="mut">Últimos escritos en el libro</summary>${rec}</details>`:'')},
async libroCargar(){try{const e=await api('libroEstado');ACT.libroPintar(e)}catch(x){const b=$('libroEstado');if(b)b.innerHTML='<span class="mut">'+esc(x.message)+'</span>'}},

  const c={libro_id:val('c_libro_id'),libro_activo:val('c_libro_activo'),libro_desde:val('c_libro_desde'),libro_alias:val('c_libro_alias')};
  try{const r=await api('guardarConfig',{config:c});A.cfg=r.config;toast('Guardado. Probando conexión…');
    const pr=c.libro_id?await api('libroProbar',{}):null;const e=await api('libroEstado');ACT.libroPintar(e,pr)}catch(x){toast(x.message,true);const b=$('libroEstado');if(b)b.innerHTML='<div class="banner warn">'+esc(x.message)+'</div>'}},

abrirInicio(){
  const hoy=hoyL(),asig=((EST&&EST.programacion)||[]).filter(x=>x.Fecha===hoy);
  const libre=EST&&EST.exigir===false;
  if(!asig.length&&!libre){modal(`<h2 style="margin-top:0">Sin turno asignado hoy</h2><p>Hoy no tienes un turno programado. Para trabajar necesitas autorización del administrador.</p><button class="btn big" data-act="abrirCambio">🔄 Solicitar cambio / otra área</button>`);return}

  modal(`<h2 style="margin-top:0">Iniciar turno</h2><label>Tu turno asignado</label><select id="i_tipo" data-chg="inTipo">${tipos.map(k=>`<option value="${k}">${esc(TIPOS[k])}</option>`).join('')}</select>
  <label>Placa del vehículo</label><input id="i_veh" autocapitalize="characters" placeholder="ABC123"><label>Zona / ruta</label><input id="i_zona" placeholder="Ej: Bodega Funza → Medellín"><div id="i_car" style="display:none;border:2px solid #1b9e4b;border-radius:12px;padding:10px;margin:8px 0"><b>🚛 Datos de la caravana</b><label>Código de caravana *</label><input id="i_cod" data-chg="car" inputmode="numeric" placeholder="Ej: 26 (el mismo del libro)" list="i_cods" autocomplete="off"><datalist id="i_cods">${((EST&&EST.caravanas)||[]).map(c=>`<option value="${esc(c.codigo)}">${esc(c.destino||'')}</option>`).join('')}</datalist><p class="mut" style="margin:4px 0">Si tus compañeros ya iniciaron, escribe el mismo código para unirte a su caravana.</p><label>Vehículos custodiados (placas, hasta 3)</label><div class="grid2"><input id="i_c1" placeholder="Placa 1" autocapitalize="characters"><input id="i_c2" placeholder="Placa 2" autocapitalize="characters"></div><input id="i_c3" placeholder="Placa 3" autocapitalize="characters" style="margin-top:6px"><label>Placa del blindado</label><input id="i_bl" placeholder="Placa" autocapitalize="characters"></div><div id="i_ven" class="mut" style="margin:8px 0"></div><div id="i_late" style="display:none;border:2px solid var(--bad);background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px;margin:8px 0"><b>⛔ Estás iniciando tarde (<span id="i_dif"></span> min)</b><br><b>Ten en cuenta que los inicios tarde pueden afectar las solicitudes de permisos y las salidas a caravanas.</b><br>Se enviará un reporte al administrador. Indica el motivo:<label>Motivo del inicio tarde *</label><select id="i_mot"><option value="">— Elige el motivo —</option>${MOTIVOS_T.map(m=>`<option>${esc(m)}</option>`).join('')}</select><label>Detalle (opcional)</label><textarea id="i_motn" placeholder="Ej: bloqueo en la autopista, avisé al coordinador"></textarea></div><p class="mut" id="i_gps">Se tomará tu ubicación al iniciar (en caravana no).</p><button class="btn big ok" id="i_go" data-act="iniciar">▶ Iniciar ahora</button><div style="margin-top:12px"><button class="btn ghost sm" data-act="abrirCambio">¿Vas a otra área? Solicita el cambio</button></div>`);
  ACT.chg_inTipo();
},
chg_inTipo(){const k=val('i_tipo'),pg=((EST&&EST.programacion)||[]).find(x=>x.Fecha===hoyL()&&(x.Tipo||'TAT')===k);if(pg){$('i_veh').value=pg.Placa||'';$('i_zona').value=pg.Punto||''}ACT.carBloque();ACT.ventana()},
chg_car(){ACT.carAuto()},
carBloque(){const c=$('i_car');if(c)c.style.display=val('i_tipo')==='CARAVANA'?'block':'none'},
carAuto(){const x=((EST&&EST.caravanas)||[]).find(c=>c.codigo===String(parseInt(val('i_cod'),10)));if(!x)return;if(!val('i_zona'))$('i_zona').value=x.destino||'';[['i_c1',0],['i_c2',1],['i_c3',2]].forEach(([i,n])=>{if(!val(i))$(i).value=x.cust[n]||''});if(!val('i_bl'))$('i_bl').value=x.blindado||''},
ventana(){const k=val('i_tipo'),pg=((EST&&EST.programacion)||[]).find(x=>x.Fecha===hoyL()&&(x.Tipo||'TAT')===k),ve=$('i_ven'),lt=$('i_late');if(!ve)return null;
  if(!pg){ve.textContent='';lt.style.display='none';return null}
  const an=EST&&EST.antes!=null?EST.antes:5,de=EST&&EST.despues!=null?EST.despues:5,hm=x=>{const[a,b]=String(x).split(':');return (+a)*60+(+b)},n=new Date(),dif=n.getHours()*60+n.getMinutes()-hm(pg.Hora),f=m=>pad(Math.floor(m/60))+':'+pad(m%60);
  ve.innerHTML=`🕒 Tu hora: <b>${esc(pg.Hora)}</b> · puedes iniciar de <b>${f(hm(pg.Hora)-an)}</b> a <b>${f(hm(pg.Hora)+de)}</b>`;
  if(dif>de&&!pg.Motivo){$('i_dif').textContent=dif;lt.style.display='block'}else lt.style.display='none';
  return {dif,an,de,pg}},
async abrirPunt(){
  modal('<h2 style="margin-top:0">🏅 Puntualidad del equipo</h2><p class="mut">Cargando…</p>');
  try{const d=await api('puntualidadEquipo');
    const cl=v=>v<=5?'ok':v<=15?'warn':'bad',et=v=>v<=5?'Puntual':v<=15?'En observación':'Por mejorar';
    const yo=d.filas.find(x=>x.id===d.yo);
    let msg=`<div class="banner ok">🌟 ${esc(MSG_PUNTUAL)}</div>`;
    if(yo)msg=yo.pctImp<=5?`<div class="banner ok">🌟 <b>¡Excelente! Tu impuntualidad es de ${yo.pctImp} %.</b> Tu puntualidad es ejemplo para el equipo. ¡Gracias!</div>`
      :`<div class="banner ${yo.pctImp<=15?'warn':'bad'}"><b>Tu impuntualidad es de ${yo.pctImp} %.</b> Cada turno que inicies a tiempo la baja y mejora tus opciones de permisos y caravanas. ¡Tú puedes!</div>`;
    const fila=(x,i)=>{const k=cl(x.pctImp),c=k==='ok'?'ok':k==='warn'?'warn':'bad';return `<tr style="${x.id===d.yo?'background:var(--okbg);font-weight:600':''}"><td>${i+1}</td><td>${esc(nombreCorto(x.nombre))}${x.id===d.yo?' (tú)':''}</td><td>${x.prog}</td><td>${x.tarde+x.noinicio}</td><td style="min-width:84px"><span class="badge ${k}">${x.pctImp} %</span><div style="background:var(--line);border-radius:6px;height:6px;margin-top:4px"><div style="width:${Math.min(100,x.pctImp)}%;height:6px;border-radius:6px;background:var(--${c})"></div></div></td></tr>`};
    modal(`<h2 style="margin-top:0">🏅 Puntualidad del equipo</h2><p class="mut" style="margin-top:0">Últimos ${d.dias} días (${esc(fecha(d.desde))} al ${esc(fecha(d.hasta))}). Impuntualidad = turnos iniciados tarde (más de ${d.umbral} min) o sin iniciar, sobre los turnos programados.</p>${msg}
    ${d.filas.length?`<div class="scroll"><table><tr><th>#</th><th>Escolta</th><th>Turnos</th><th>Fallas</th><th>Impuntualidad</th></tr>${d.filas.map(fila).join('')}</table></div>`:'<p class="mut">Aún no hay turnos programados para medir.</p>'}
    ${d.equipoPctImp!=null?`<p style="margin:10px 0 0"><b>Todo el equipo:</b> ${d.equipoPctImp} % de impuntualidad</p>`:''}
    <p class="mut" style="font-size:12px;margin:8px 0 12px"><span class="badge ok">0 – 5 %</span> Puntual · <span class="badge warn">5 – 15 %</span> En observación · <span class="badge bad">más de 15 %</span> Por mejorar</p>
    <p class="mut" style="font-size:12px;margin:0 0 12px">${esc(AVISO_TARDE)}</p><button class="btn ghost big" data-act="cerrarModal">Cerrar</button>`);
  }catch(e){closeModal();toast(e.message,true)}
},

async iniciar(){
  const b=$('i_go');b.disabled=true;
  const tipo=val('i_tipo'),pl={tipo,vehiculo:val('i_veh'),zona:val('i_zona')};
  const vv=ACT.ventana();
  if(vv&&vv.dif<-vv.an&&!(EST&&EST.turno)){toast('Aún no es tu hora. Podrás iniciar 5 min antes de las '+vv.pg.Hora,true);b.disabled=false;return}
  if(tipo==='CARAVANA'){const cod=val('i_cod').replace(/\D/g,'');if(!cod){toast('Escribe el código de la caravana',true);b.disabled=false;return}Object.assign(pl,{codigo:cod,cust1:val('i_c1'),cust2:val('i_c2'),cust3:val('i_c3'),blindado:val('i_bl')})}
  if($('i_late')&&$('i_late').style.display==='block'){if(!val('i_mot')){toast('Elige el motivo del inicio tarde',true);b.disabled=false;return}pl.motivo=val('i_mot');pl.nota=val('i_motn')}
  try{
    if(tipo!=='CARAVANA'){b.textContent='Tomando ubicación…';const p=await getPos(10000);Object.assign(pl,p)}
    const r=await accion('iniciarTurno',pl);closeModal();
    if(r&&r.alertas&&r.alertas.some(a=>/^INICIO TARDE/.test(a)))toast('⛔ Inició tarde. '+AVISO_TARDE,true);else if(r&&r.alertas&&r.alertas.length)toast('Turno iniciado con aviso: '+r.alertas.join(', '));else toast('Turno iniciado. '+MSG_PUNTUAL);
    if(!r.offline)await cargaEsc(true);
  }catch(e){
    if(String(e.message).startsWith('MOTIVO_TARDE')){const x=e.message.split('|');$('i_dif').textContent=x[1];$('i_late').style.display='block';toast('Estás iniciando tarde: elige el motivo y vuelve a pulsar Iniciar',true)}
    else toast(e.message,true);b.disabled=false;b.textContent='▶ Iniciar ahora'}
},

cvPintar(){
  const r=A.data.cv,sel=A.data.cvSel;if(!r||!$('cvRes'))return;
  const mapa=r.mapa.length?`<div class="mut" style="margin-bottom:4px">Tripulaciones de ${r.n} que podrías armar según el día de salida:</div><div style="display:flex;gap:6px;flex-wrap:wrap">${r.mapa.map(m=>`<div style="border:1px solid var(--line);border-radius:10px;padding:5px 9px;text-align:center;min-width:62px"><div class="mut" style="font-size:11px">${fecha(m.fecha)}</div><b style="color:var(--${m.tripulaciones>=2?'ok':m.tripulaciones===1?'warn':'bad'})">${m.tripulaciones}</b></div>`).join('')}</div>`:'';
  $('cvMapa').innerHTML=mapa;
  const badge=e=>e==='OK'?'<span class="badge ok">APTO</span>':e==='REEMPLAZO'?'<span class="badge warn">APTO · reemplazar en TAT</span>':'<span class="badge bad">NO PUEDE</span>';
  const elegidos=r.candidatos.filter(c=>sel.has(c.id));
  let h=`<div style="margin-top:12px"><b>Salida ${fecha(r.salida)} · ${r.dias} día(s) · regreso ${fecha(r.fin)}</b>${r.destino?' · '+esc(r.destino):''}</div>`;
  if(r.faltan)h+=`<div class="card" style="background:var(--badbg);margin:8px 0"><b>Solo hay ${r.n-r.faltan} escolta(s) disponibles de los ${r.n} que pide.</b><br><span class="mut">Prueba otra fecha de salida (mira los números de arriba) o revisa los motivos de cada escolta.</span></div>`;
  if(r.repetida)h+=`<div class="card" style="background:var(--warnbg);margin:8px 0">⚠ Esta tripulación ya salió en otra caravana esta semana y no hay un cambio que la evite.</div>`;
  h+=`<div class="mut" style="margin:8px 0 2px">Marcados: <b>${elegidos.length}</b> de ${r.n}. Cambia a quien quieras; los que no cumplen las reglas aparecen abajo con el motivo.</div>`;
  h+=r.candidatos.map(c=>{const no=c.estado==='NO';

  try{await api('responderSolicitud',{id:d.id,aceptar:ok,respuesta:resp});

    const txt=cam?`Tu solicitud de cambio a ${TIPOS[s.TipoTurno]||''} (${s.Lugar}) fue ${ok?'APROBADA. Ya puedes iniciar tu turno.':'NEGADA.'}${resp?' '+resp:''}`:`Solicitud de personal (${s.Lugar}, ${fecha(s.Fecha)} ${s.Hora}): ${ok?'ACEPTADA':'NEGADA'}${resp?'. '+resp:''}`;
    const tel=cam?(A.data.tel||{})[s.EscoltaID]:((A.cfg&&A.cfg.tel_central)||S.cfg.tel_central);
    modal(`<h2 style="margin-top:0">Respuesta registrada</h2><p>${cam?'Avisa al escolta por WhatsApp (también le llega aviso a su celular si activó ntfy):':'Avisa a la Central por WhatsApp (también le llega aviso a su celular si activó ntfy):'}</p><a class="btn ok big" target="_blank" rel="noopener" href="${esc(wa(tel,txt))}">Abrir WhatsApp</a><br><br><button class="btn ghost big" data-act="cerrarYSol">Listo</button>`);
  }catch(e){toast(e.message,true)}
},
cerrarYSol(){closeModal();irTab('solic')},
/* escoltas */
async addEscolta(){const n=val('en_n');if(!n)return toast('Escribe el nombre',true);try{const r=await api('guardarEscolta',{nombre:n,telefono:val('en_t')});mostrarPins([r]);irTab('escoltas')}catch(e){toast(e.message,true)}},
pegarLista(){modal(`<h2 style="margin-top:0">Pegar lista</h2><p class="mut">Un nombre por línea (APELLIDOS NOMBRES).</p><textarea id="pl_t" style="min-height:200px"></textarea><br><button class="btn big" data-act="cargarLista">Crear escoltas</button>`)},
async cargarLista(){try{const r=await api('cargarEscoltas',{lista:val('pl_t')});mostrarPins(r.creados);irTab('escoltas')}catch(e){toast(e.message,true)}},
async cargarFijos(){if(!confirm('Se crearán los escoltas fijos que aún no existan. ¿Continuar?'))return;try{const r=await api('cargarFijos');mostrarPins(r.creados);irTab('escoltas')}catch(e){toast(e.message,true)}},
editEscolta(d){const e=A.data.escoltas.find(x=>x.ID===d.id);modal(`<h2 style="margin-top:0">Editar escolta</h2><input type="hidden" id="ee_id" value="${esc(e.ID)}"><label>Nombre</label><input id="ee_n" value="${esc(e.Nombre)}"><label>Celular</label><input id="ee_t" value="${esc(e.Telefono)}" inputmode="tel"><label>Estado</label><select id="ee_a"><option value="SI">Activo</option><option value="NO" ${e.Activo==='NO'?'selected':''}>Inactivo (no puede entrar; conserva historial)</option></select><br><button class="btn big" data-act="guardarEsc">Guardar</button>`)},
async guardarEsc(){try{await api('guardarEscolta',{id:val('ee_id'),nombre:val('ee_n'),telefono:val('ee_t'),activo:val('ee_a')==='SI'});closeModal();irTab('escoltas')}catch(e){toast(e.message,true)}},
async resetPin(d){const e=A.data.escoltas.find(x=>x.ID===d.id);if(!confirm('¿Generar un PIN nuevo para '+e.Nombre+'?'))return;try{const r=await api('reiniciarPin',{id:d.id});mostrarPins([{nombre:r.nombre,pin:r.pin,id:d.id}])}catch(er){toast(er.message,true)}},
/* export */
async exp(d){
  const f={desde:val('xd'),hasta:val('xh')};A.data.xf=f;
  try{const r=await api('exportar',f);const n=d.k==='Tat'?r.csvTat:d.k==='Caravanas'?r.csvCaravanas:d.k==='Inicios'?r.csvInicios:r.csvTodo;
    descargar(`turnos_${d.k.toLowerCase()}_${f.desde}_${f.hasta}.csv`,n);toast('Archivo descargado')}catch(e){toast(e.message,true)}
},
/* ajustes */
async guardarCfg(){const c={};['operacion','tope_semanal','horas_caravana','punt_dias','hora_inicio_min','hora_inicio_max','bloquear_fuera_horario','bloquear_fuera_geocerca','exigir_programacion','min_aviso_previo','min_antes','min_despues','bloquear_temprano','min_tarde','min_escalar','tel_admin','tel_central','email_avisos'].forEach(k=>c[k]=val('c_'+k));try{const r=await api('guardarConfig',{config:c});A.cfg=r.config;S.cfg.operacion=c.operacion;S.cfg.tel_central=c.tel_central;S.cfg.tel_admin=c.tel_admin;saveS();toast('Reglas guardadas')}catch(e){toast(e.message,true)}},
nuevaGeo(){formGeo({})},
editGeo(d){formGeo(A.data.geo.find(x=>x.ID===d.id))},
async usarMiUbicacion(){toast('Tomando ubicación…');const p=await getPos(12000);if(!p.lat)return toast('No se pudo obtener la ubicación',true);$('g_lat').value=p.lat.toFixed(6);$('g_lng').value=p.lng.toFixed(6)},
async guardarGeo(){try{await api('guardarGeocerca',{id:val('g_id'),nombre:val('g_n'),lat:val('g_lat'),lng:val('g_lng'),radio:val('g_r'),activa:val('g_a')==='SI'});closeModal();irTab('ajustes')}catch(e){toast(e.message,true)}},
async borrarGeo(d){if(!confirm('¿Eliminar geocerca?'))return;try{await api('eliminarGeocerca',{id:d.id});closeModal();irTab('ajustes')}catch(e){toast(e.message,true)}},
claveCentral(){modal(`<h2 style="margin-top:0">Clave de la Central</h2><label>Nueva clave (mínimo 4)</label><input id="cc_c"><br><button class="btn big" data-act="guardarCC">Guardar</button>`)},
async guardarCC(){try{await api('ponerPinCentral',{clave:val('cc_c')});closeModal();toast('Clave de Central guardada');irTab('ajustes')}catch(e){toast(e.message,true)}},
claveAdmin(){modal(`<h2 style="margin-top:0">Cambiar mi clave</h2><label>Clave actual</label><input id="ca_a" type="password"><label>Clave nueva (mínimo 6)</label><input id="ca_n" type="password"><br><button class="btn big" data-act="guardarCA">Guardar</button>`)},
async guardarCA(){try{await api('cambiarClaveAdmin',{actual:$('ca_a').value,nueva:$('ca_n').value});closeModal();toast('Clave cambiada')}catch(e){toast(e.message,true)}}
};
function formTurno(t){
  const es=A.data.escoltas||[];const dt=s=>s?s.slice(0,16).replace(' ','T'):'';
  modal(`<h2 style="margin-top:0">${t.ID?'Editar':'Nuevo'} turno</h2><input type="hidden" id="t_id" value="${esc(t.ID||'')}"><label>Escolta</label><select id="t_esc">${es.filter(e=>e.Activo!=='NO'||e.ID===t.EscoltaID).map(e=>`<option value="${esc(e.ID)}" ${e.ID===t.EscoltaID?'selected':''}>${esc(e.Nombre)}</option>`).join('')}</select>
  <label>Tipo</label><select id="t_tipo">${Object.entries(TIPOS).map(([k,n])=>`<option value="${k}" ${k===t.Tipo?'selected':''}>${n}</option>`).join('')}</select>
  <div class="grid2"><div><label>Inicio</label><input type="datetime-local" id="t_ini" value="${dt(t.Inicio)}"></div><div><label>Fin (vacío = abierto)</label><input type="datetime-local" id="t_fin" value="${dt(t.Fin)}"></div></div>
  <label>Código de caravana (solo si es Caravana)</label><input id="t_cod" inputmode="numeric" value="${esc(t.Codigo||'')}"><label>Placa</label><input id="t_veh" value="${esc(t.Vehiculo||'')}"><label>Zona / ruta</label><input id="t_zona" value="${esc(t.ZonaRuta||'')}"><label>Observaciones</label><textarea id="t_obs">${esc(t.Obs||'')}</textarea>
  <br><div class="row"><button class="btn ok grow" data-act="guardarTurno">Guardar</button>${t.ID?`<button class="btn bad" data-act="borrarTurno" data-id="${esc(t.ID)}">Eliminar</button>`:''}</div>`);
}
function formGeo(g){modal(`<h2 style="margin-top:0">${g.ID?'Editar':'Nueva'} geocerca</h2><input type="hidden" id="g_id" value="${esc(g.ID||'')}"><label>Nombre</label><input id="g_n" value="${esc(g.Nombre||'')}"><div class="grid2"><div><label>Latitud</label><input id="g_lat" value="${esc(g.Lat||'')}" inputmode="decimal"></div><div><label>Longitud</label><input id="g_lng" value="${esc(g.Lng||'')}" inputmode="decimal"></div><div><label>Radio (m)</label><input id="g_r" type="number" value="${esc(g.RadioM||150)}"></div><div><label>Estado</label><select id="g_a"><option value="SI">Activa</option><option value="NO" ${g.Activa==='NO'?'selected':''}>Inactiva</option></select></div></div><br><div class="row"><button class="btn ghost" data-act="usarMiUbicacion">📍 Usar mi ubicación</button><button class="btn ok grow" data-act="guardarGeo">Guardar</button>${g.ID?`<button class="btn bad" data-act="borrarGeo" data-id="${esc(g.ID)}">Eliminar</button>`:''}</div><p class="mut">Estando en el punto, toca "Usar mi ubicación".</p>`)}
function mostrarPins(l){
  if(!l.length)return toast('No hay escoltas nuevos para crear');
  const txt=l.map(x=>`${x.nombre}: PIN ${x.pin}`).join('\n');
  const tel=id=>{const e=(A.data.escoltas||[]).find(z=>z.ID===id);return e&&e.Telefono};
  modal(`<h2 style="margin-top:0">PIN de acceso</h2><div class="banner warn">Anótalos ahora: por seguridad no se vuelven a mostrar (si se pierde uno, se genera otro con el botón PIN).</div>${l.map(x=>`<div class="item"><b>${esc(x.nombre)}</b> → <span style="font-size:22px;font-weight:700">${esc(x.pin)}</span>${x.id&&tel(x.id)?` <a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(wa(tel(x.id),'Tu PIN para el registro de turnos es '+x.pin))}">WhatsApp</a>`:''}</div>`).join('')}<br><div class="row"><button class="btn" data-act="copiar" data-v="${esc(txt)}">Copiar todos</button><button class="btn ghost" data-act="imprimir">Imprimir</button></div>`);
}
ACT.imprimir=()=>window.print();

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(!f)return;e.preventDefault();f(b.dataset,b);
});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.chg;if(c&&ACT['chg_'+c])ACT['chg_'+c]()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lg_pin')ACT.entrarE();if(e.key==='Enter'&&e.target.id==='lg_clave')LOGIN.rol==='A'?ACT.entrarA():ACT.entrarC()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token){sinLeer=0;document.title='Registro de Turnos';if(S.rol!=='E')pulsoAdm();if(S.rol==='E'){flush();cargaEsc(true)}else if(A.tab==='tablero')irTab('tablero')}});
arrancar();
</script>
<script>
/* ===== Consola: tema, reloj, módulos plegables ===== */
(function(){
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}},SL=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const raiz=document.documentElement;
function tema(t){if(t==='dia')raiz.setAttribute('data-tema','dia');else raiz.removeAttribute('data-tema');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dia'?'#f9fbfe':'#070e1c'}
tema(LS('tema')||'noche');
const pad=n=>String(n).padStart(2,'0');
function hora(){const d=new Date();const h=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());const f=d.toLocaleDateString('es-CO',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,'');document.querySelectorAll('header .reloj').forEach(r=>{r.firstChild.nodeValue=h;r.lastChild.textContent=f})}
function cabecera(){
  document.querySelectorAll('header').forEach(h=>{
    if(!h.querySelector('.led')){const l=document.createElement('i');l.className='led';l.title='Conexión';h.insertBefore(l,h.firstChild)}
    if(!h.querySelector('.reloj')){const r=document.createElement('div');r.className='reloj';r.innerHTML='00:00:00<small></small>';const b=h.querySelector('button');h.insertBefore(r,b)}
    if(!h.querySelector('.btema')){const b=document.createElement('button');b.className='btema';b.type='button';b.setAttribute('aria-label','Cambiar entre modo noche y modo día');h.appendChild(b)}
    const bt=h.querySelector('.btema');if(bt)bt.textContent=raiz.getAttribute('data-tema')==='dia'?'🌙':'☀';
    const led=h.querySelector('.led');if(led)led.classList.toggle('off',!navigator.onLine);
  });hora();
}
document.addEventListener('click',e=>{const b=e.target.closest('.btema');if(!b)return;const dia=raiz.getAttribute('data-tema')==='dia';tema(dia?'noche':'dia');SL('tema',dia?'noche':'dia');cabecera()});
addEventListener('online',cabecera);addEventListener('offline',cabecera);
setInterval(hora,1000);
/* módulos */
const clave=c=>{const t=(c.querySelector(':scope>h2')||{}).textContent||'';const v=(document.querySelector('.tabs .on')||{}).textContent||(c.closest('#esc')?'esc':'');return 'plg:'+v+':'+t.replace(/[\d()]+/g,'').trim().slice(0,40)};
function modulos(){
  const cs=document.querySelectorAll('main .card');
  cs.forEach(c=>{
    const h=c.querySelector(':scope>h2');if(!h||c.classList.contains('plegable')&&c.dataset.k)return;
    c.classList.add('plegable');c.dataset.k=clave(c);
    h.setAttribute('role','button');h.tabIndex=0;
    if(LS(c.dataset.k)==='1')c.classList.add('plg');
    h.setAttribute('aria-expanded',c.classList.contains('plg')?'false':'true');
  });
  const v=document.getElementById('vista');
  if(v&&!v.querySelector(':scope>.modbar')&&v.querySelectorAll('.card.plegable').length>=3){
    const m=document.createElement('div');m.className='modbar';m.innerHTML='<span>módulos</span><button type="button" data-plg="1">Plegar todo</button><button type="button" data-plg="0">Desplegar todo</button>';v.insertBefore(m,v.firstChild);
  }
}
function alterna(c,plegar){const p=plegar==null?!c.classList.contains('plg'):plegar;c.classList.toggle('plg',p);SL(c.dataset.k,p?'1':null);const h=c.querySelector(':scope>h2');if(h)h.setAttribute('aria-expanded',p?'false':'true')}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-plg]');
  if(b){document.querySelectorAll('#vista .card.plegable').forEach(c=>alterna(c,b.dataset.plg==='1'));return}
  const h=e.target.closest('main .card.plegable>h2');
  if(h&&!e.target.closest('a,button,input,select,label'))alterna(h.parentNode);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('main .card.plegable>h2')){e.preventDefault();alterna(e.target.parentNode)}});
let q=0;const ob=new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;cabecera();modulos()})});
ob.observe(document.getElementById('root'),{childList:true,subtree:true});
cabecera();modulos();
})();
</script>
</body>
</html>
