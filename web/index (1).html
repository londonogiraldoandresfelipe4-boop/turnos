<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registro de Turnos</title>
<meta name="theme-color" content="#0b2545">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f2f5f9;--card:#fff;--tx:#0f1b2d;--mut:#5b6b80;--line:#dbe3ee;--pri:#0b2545;--acc:#1f7ae0;--ok:#188a4b;--warn:#c77700;--bad:#c62828;--okbg:#e3f6ea;--warnbg:#fff1d6;--badbg:#fde4e4}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131d30;--tx:#e8eef7;--mut:#93a4bb;--line:#24324b;--pri:#1b3a6b;--acc:#4a9bff;--okbg:#10321f;--warnbg:#3a2a07;--badbg:#3d1414}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
header small{display:block;font-weight:400;opacity:.8;font-size:12px}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:12px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 16px;background:var(--acc);color:#fff;font-weight:600;text-align:center;text-decoration:none}
.btn.big{width:100%;padding:20px;font-size:20px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 -4px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--line);color:var(--tx)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.big-time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--acc)}.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
.scroll{overflow-x:auto}
.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.banner{padding:10px 14px;border-radius:10px;margin:0 0 12px;font-size:14px}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.ok{background:var(--okbg);color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:18px}}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:99;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#toast div{background:#10243f;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast div.err{background:var(--bad)}
.center{max-width:430px;margin:0 auto}
.pin{letter-spacing:.4em;text-align:center;font-size:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{text-align:center;padding:8px}.kpi b{display:block;font-size:26px}.kpi span{font-size:12px;color:var(--mut)}
code{background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= utilidades ================= */
const MEM={};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);return null}catch(e){if(v===undefined)return MEM[k]||null;if(v===null)delete MEM[k];else MEM[k]=v;return null}};
const jp=(s,d)=>{try{return JSON.parse(s)??d}catch(e){return d}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const val=id=>{const e=$(id);return e?e.value.trim():''};
const TIPOS={TAT:'TAT (REPCO)',CARAVANA:'Caravana',MOVIMIENTO:'Movimiento de bodega',DISPONIBLE:'Disponible Prosegur'};
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const pad=n=>String(n).padStart(2,'0');
const naive=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const hoyL=()=>naive().slice(0,10);
const msN=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2})(?::(\d{2}))?)?$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)):NaN};
const addD=(f,n)=>new Date(msN(f)+n*864e5).toISOString().slice(0,10);
const lunes=f=>addD(f,-((new Date(msN(f)).getUTCDay()+6)%7));
const hm=s=>(s||'').slice(11,16);
const fecha=f=>{if(!f)return'';const d=new Date(msN(f));return `${DIAS[d.getUTCDay()]} ${f.slice(8,10)}/${f.slice(5,7)}`};
const fh=h=>{h=+h||0;const m=Math.round(h*60);return `${Math.floor(m/60)} h ${pad(m%60)} min`};
const f1=h=>(+h||0).toFixed(1);
const nombreCorto=n=>{const p=String(n||'').split(' ').filter(Boolean);return p.length>=3?p[0]+' '+p[2]:p.slice(0,2).join(' ')};
function toast(t,err){const d=document.createElement('div');d.textContent=t;if(err)d.className='err';$('toast').appendChild(d);setTimeout(()=>d.remove(),err?6000:3200)}
function modal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML='<div>'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){const m=$('modal');if(m)m.remove()}
function barra(v,tope){const p=Math.min(100,v/tope*100);const c=v>tope?'b':v>tope*0.85?'w':'';return `<div class="bar"><i class="${c}" style="width:${p}%"></i></div>`}
function descargar(nombre,texto,tipo){const b=new Blob([texto],{type:tipo||'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},500)}
function wa(tel,texto){const t=String(tel||'').replace(/\D/g,'');const num=t?(t.length===10?'57'+t:t):'';return `https://wa.me/${num}?text=${encodeURIComponent(texto)}`}
function getPos(ms){return new Promise(res=>{if(!navigator.geolocation)return res({});let hecho=false;const fin=v=>{if(!hecho){hecho=true;res(v)}};setTimeout(()=>fin({}),ms+1500);navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,prec:p.coords.accuracy}),()=>fin({}),{enableHighAccuracy:true,timeout:ms,maximumAge:0})})}
async function notificar(t,b){try{toast(t+(b?': '+b:''));if(navigator.vibrate)navigator.vibrate([200,100,200]);if('Notification' in window&&Notification.permission==='granted'){const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)reg.showNotification(t,{body:b||'',icon:'icon-192.png',badge:'icon-192.png'});else new Notification(t,{body:b||'',icon:'icon-192.png'})}}catch(e){}}

/* ================= estado y API ================= */
let S={api:LS('rt_api')||'',token:'',rol:'',id:'',nombre:'',cfg:{}};
const ses=jp(LS('rt_s'),null);
if(ses&&ses.token){Object.assign(S,ses)}
let Q=jp(LS('rt_q'),[]);
const saveQ=()=>LS('rt_q',JSON.stringify(Q));
const saveS=()=>LS('rt_s',S.token?JSON.stringify({token:S.token,rol:S.rol,id:S.id,nombre:S.nombre,cfg:S.cfg}):null);
let online=true;

async function api(action,payload,publico){
  if(!S.api)throw Object.assign(new Error('Falta el enlace del sistema'),{server:true});
  let r;
  try{
    const resp=await fetch(S.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:publico?'':S.token,payload:payload||{}})});
    r=await resp.json();
  }catch(e){online=false;pintaEstado();throw Object.assign(new Error('Sin conexión'),{offline:true})}
  online=true;pintaEstado();
  if(!r.ok){
    if(r.error==='SESION'){salir(true);throw Object.assign(new Error('Sesión vencida'),{server:true})}
    throw Object.assign(new Error(r.msg||r.error||'Error'),{server:true});
  }
  return r.data;
}
function pintaEstado(){const b=$('estado');if(!b)return;const n=Q.filter(x=>x.uid===S.id).length;b.innerHTML=(!online?'<div class="banner warn">Sin señal. Lo que registres se guarda en el celular y se envía solo cuando vuelva la conexión.</div>':'')+(n?`<div class="banner warn">${n} registro(s) pendiente(s) de enviar${online?' · <a href="#" data-act="enviarCola">Enviar ahora</a>':''}</div>`:'')}

/* acciones del escolta con cola sin conexión */
async function accion(action,payload){
  try{return await api(action,payload)}
  catch(e){
    if(!e.offline)throw e;
    const p={...payload,ts:Date.now()};
    Q.push({action,payload:p,uid:S.id});saveQ();optimista(action,p);pintaEstado();
    toast('Sin señal: guardado en el celular');return {offline:true};
  }
}
function optimista(a,p){
  const E=jp(LS('rt_est'),null);if(!E)return;
  if(a==='iniciarTurno')E.turno={ID:'local',Tipo:p.tipo,Vehiculo:(p.vehiculo||'').toUpperCase(),ZonaRuta:(p.zona||'').toUpperCase(),Inicio:naive(new Date(p.ts)),pendiente:true};
  if(a==='cerrarTurno')E.turno=null;
  if(a==='registrarParada')E.paradas.push({Momento:naive(new Date(p.ts)),Tipo:p.tipo,Nota:p.nota});
  if(a==='registrarMovimiento')E.movimientos.push({Momento:naive(new Date(p.ts)),Ruta:p.ruta,Placa:p.placa,Viajes:p.viajes,PesoKg:p.peso});
  E.base=Date.now();E.ahora=naive();LS('rt_est',JSON.stringify(E));EST=E;pintaEsc();
}
let flushing=false;
async function flush(){
  if(flushing||!S.token||S.rol!=='E')return;
  flushing=true;
  try{
    for(const it of Q.slice()){
      if(it.uid!==S.id)continue;
      try{await api(it.action,it.payload);Q.splice(Q.indexOf(it),1);saveQ()}
      catch(e){if(e.offline)break;if(e.server){toast('No se pudo enviar un registro: '+e.message,true);Q.splice(Q.indexOf(it),1);saveQ()}else break}
    }
  }finally{flushing=false;pintaEstado()}
  await cargaEsc(true);
}

/* ================= arranque ================= */
const hash=new URLSearchParams(location.hash.slice(1));
if(hash.get('api')){S.api=hash.get('api');LS('rt_api',S.api);history.replaceState(null,'',location.pathname+location.search)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('online',()=>{online=true;flush();pintaEstado()});
window.addEventListener('offline',()=>{online=false;pintaEstado()});

function salir(silencio){S.token='';S.rol='';S.id='';S.nombre='';saveS();LS('rt_est',null);clearInterval(T.pulso);clearInterval(T.tic);if(!silencio)toast('Sesión cerrada');vistaLogin()}
const T={};
function arrancar(){
  if(!S.api)return vistaConfigApi();
  if(S.token){S.rol==='E'?vistaEscolta():vistaAdmin();return}
  vistaLogin();
}

/* ================= login ================= */
function vistaConfigApi(){
  $('root').innerHTML=`<header><h1>Registro de Turnos<small>Configuración inicial</small></h1></header><main><div class="card center">
  <h2>Enlace del sistema</h2><p class="mut">Pega el enlace que termina en <code>/exec</code> (lo entrega el administrador). Normalmente no necesitas hacerlo: basta abrir el enlace que te enviaron.</p>
  <input id="apiurl" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"><br><br><button class="btn big" data-act="guardarApi">Guardar</button></div></main>`;
}
let LOGIN={rol:'E',lista:null,adminCreado:true};
async function vistaLogin(){
  LOGIN.lista=null;
  $('root').innerHTML=`<header><h1>Registro de Turnos<small id="op"></small></h1><button data-act="cambiarApi">⚙</button></header>
  <main><div class="center"><div class="tabs" id="rolTabs"></div><div class="card" id="loginBox"><p class="mut">Cargando…</p></div><div id="estado"></div></div></main>`;
  pintaLogin();
  try{
    const [l,a]=await Promise.all([api('listaEscoltas',{},true),api('estadoAdmin',{},true)]);
    LOGIN.lista=l.escoltas;LOGIN.adminCreado=a.adminCreado;$('op').textContent=l.operacion||'';pintaLogin();
  }catch(e){const b=$('loginBox');if(b)b.innerHTML=`<div class="banner bad">${e.offline?'No hay conexión con el sistema. Revisa tu internet.':esc(e.message)}</div><button class="btn" data-act="reintentarLogin">Reintentar</button>`}
}
function pintaLogin(){
  $('rolTabs').innerHTML=[['E','Escolta'],['A','Administrador'],['C','Central']].map(([k,n])=>`<button class="${LOGIN.rol===k?'on':''}" data-act="rolLogin" data-r="${k}">${n}</button>`).join('');
  const b=$('loginBox');if(!LOGIN.lista){b.innerHTML='<p class="mut">Cargando…</p>';return}
  if(LOGIN.rol==='E')b.innerHTML=`<label>Tu nombre</label><select id="lg_id"><option value="">Elige…</option>${LOGIN.lista.map(e=>`<option value="${esc(e.id)}">${esc(e.nombre)}</option>`).join('')}</select>
   <label>PIN</label><input id="lg_pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><br><button class="btn big" data-act="entrarE">Entrar</button>`;
  else if(LOGIN.rol==='A')b.innerHTML=`${LOGIN.adminCreado?'':'<div class="banner warn">Primera vez: la clave que escribas ahora será la clave de administrador (mínimo 6 caracteres).</div>'}
   <label>${LOGIN.adminCreado?'Clave de administrador':'Crea la clave de administrador'}</label><input id="lg_clave" type="password" autocomplete="current-password"><br><button class="btn big" data-act="entrarA">${LOGIN.adminCreado?'Entrar':'Crear y entrar'}</button>`;
  else b.innerHTML=`<label>Clave de la Central</label><input id="lg_clave" type="password"><br><button class="btn big" data-act="entrarC">Entrar</button>`;
}
async function entrar(action,payload){
  try{
    const d=await api(action,payload,true);
    S.token=d.token;S.rol=d.rol;S.id=d.id||d.rol;S.nombre=d.nombre;S.cfg=d.config||{};saveS();arrancar();
  }catch(e){toast(e.message,true)}
}

/* ================= ESCOLTA ================= */
let EST=jp(LS('rt_est'),null);
function vistaEscolta(){
  $('root').innerHTML=`<header><h1>${esc(nombreCorto(S.nombre))}<small>${esc(S.cfg.operacion||'')}</small></h1><button data-act="salir">Salir</button></header><main><div id="estado"></div><div id="esc"></div></main>`;
  pintaEstado();pintaEsc();cargaEsc(false);flush();
  clearInterval(T.pulso);T.pulso=setInterval(pulsoEsc,30000);
  clearInterval(T.tic);T.tic=setInterval(tic,1000);
}
async function cargaEsc(silencio){
  try{const E=await api('miEstado');E.base=Date.now();EST=E;LS('rt_est',JSON.stringify(E));pintaEsc()}
  catch(e){if(!silencio&&!e.offline)toast(e.message,true)}
}
let ultimaProg='';
async function pulsoEsc(){
  if(Q.length)flush();
  try{const p=await api('pulso');
    if(p.ultimaProg!==ultimaProg){if(ultimaProg!==''&&p.pendientes>0)notificar('Nueva programación','Tienes turnos por confirmar');ultimaProg=p.ultimaProg;cargaEsc(true)}
  }catch(e){}
}
function transcurrido(){ // horas del turno abierto
  const t=EST&&EST.turno;if(!t)return 0;
  if(t.pendiente)return Math.max(0,(Date.now()-msN0(t.Inicio))/36e5);
  return Math.max(0,(msN(EST.ahora)-msN(t.Inicio))/36e5+(Date.now()-EST.base)/36e5);
}
const msN0=s=>{const m=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/.exec(s);return m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime():NaN};
function tic(){const e=$('reloj');if(e){const s=Math.floor(transcurrido()*3600);e.textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}}
function pintaEsc(){
  const c=$('esc');if(!c)return;
  if(!EST){c.innerHTML='<div class="card mut">Cargando…</div>';return}
  const t=EST.turno,sem=EST.semana||{repco:0,prosegur:0,total:0},tope=EST.tope||60;
  const extra=t?transcurrido():0;const totalVivo=sem.total; // el servidor ya cuenta el turno abierto
  let h='';
  h+=`<div class="card"><h2>Mis horas de la semana</h2><div class="row"><b style="font-size:24px">${f1(totalVivo)}</b><span class="mut">de ${tope} h</span><span class="grow"></span>${totalVivo>tope?'<span class="badge bad">Superaste el tope</span>':totalVivo>tope*0.85?'<span class="badge warn">Cerca del tope</span>':'<span class="badge ok">En rango</span>'}</div>${barra(totalVivo,tope)}<div class="mut" style="margin-top:6px">REPCO ${f1(sem.repco)} h · Prosegur ${f1(sem.prosegur)} h</div></div>`;
  if(!t){
    h+=`<div class="card"><h2>Turno</h2><p class="mut" style="margin-top:0">No tienes turno abierto.</p><button class="btn big ok" data-act="abrirInicio">▶ INICIAR TURNO</button></div>`;
  }else{
    h+=`<div class="card"><h2>Turno en curso ${t.pendiente?'<span class="badge warn">por enviar</span>':''}</h2>
    <div class="big-time" id="reloj">00:00:00</div>
    <div class="center" style="text-align:center"><b>${esc(TIPOS[t.Tipo]||t.Tipo)}</b> · inició ${hm(t.Inicio)}<br><span class="mut">${esc(t.Vehiculo||'—')} · ${esc(t.ZonaRuta||'—')}</span></div>
    ${t.AlertaIni?`<div class="banner warn" style="margin-top:10px">${esc(t.AlertaIni)}</div>`:''}
    <div class="grid2" style="margin-top:12px"><button class="btn" data-act="abrirParada">📍 Parada / Novedad</button><button class="btn ${t.Tipo==='MOVIMIENTO'?'':'ghost'}" data-act="abrirMov">📦 Movimiento</button></div><br>
    <button class="btn big bad" data-act="abrirCierre">■ CERRAR TURNO</button>
    ${(EST.paradas||[]).length?`<div style="margin-top:12px">${EST.paradas.slice().reverse().map(p=>`<div class="item"><b>${hm(p.Momento)}</b> ${esc(p.Tipo)} <span class="mut">${esc(p.Nota||'')}</span></div>`).join('')}</div>`:''}
    ${(EST.movimientos||[]).length?`<div style="margin-top:8px">${EST.movimientos.slice().reverse().map(p=>`<div class="item"><b>${hm(p.Momento)}</b> ${esc(p.Ruta)} · ${esc(p.Placa)} · ${esc(p.Viajes)} viaje(s)${+p.PesoKg?' · '+esc(p.PesoKg)+' kg':''}</div>`).join('')}</div>`:''}</div>`;
  }
  const pr=EST.programacion||[];

function sonido(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.15;o.start();setTimeout(()=>{o.stop();c.close()},260)}catch(e){}}
function titEvento(e){
  const [m,q,a,d]=e.split('|');const n=nombreCorto(q);
  if(a==='Confirmar programación')return ['✅ '+n+' confirmó',d];
  if(a==='Novedad')return ['⚠ Novedad de '+n,d];
  if(a==='Iniciar turno')return ['▶ '+n+' inició turno',d];
  if(a==='Cerrar turno')return ['■ '+n+' cerró turno',d];
  if(a==='Solicitud creada')return ['📨 Solicitud de personal',d];
  if(/^Solicitud (ACEPTADA|NEGADA)/.test(a))return ['📨 Solicitud '+a.split(' ')[1].toLowerCase(),d];
  return [a,d];
}
async function pulsoAdm(){
  if(!S.token||S.rol==='E')return;
  try{const p=await api('pulso');
    const evs=p.eventos||[];
    if(pulsoVisto===null){pulsoVisto=new Set(evs)}
    else{
      const nuevos=evs.filter(e=>!pulsoVisto.has(e)&&e.split('|')[1]!==S.nombre);
      evs.forEach(e=>pulsoVisto.add(e));
      if(nuevos.length){
        nuevos.slice(0,3).forEach(e=>{const [t,d]=titEvento(e);notificar(t,d)});
        sonido();
        if(document.hidden){sinLeer+=nuevos.length;document.title='('+sinLeer+') Registro de Turnos'}
        if(!$('modal')){
          if(A.tab==='tablero'||A.tab==='solic')irTab(A.tab);
          else if(A.tab==='prog')refrescaEstadosProg();
        }
      }
    }
  }catch(e){}
}

async iniciar(){
  const b=$('i_go');b.disabled=true;
  const tipo=val('i_tipo'),pl={tipo,vehiculo:val('i_veh'),zona:val('i_zona')};
  try{
    if(tipo!=='CARAVANA'){b.textContent='Tomando ubicación…';const p=await getPos(10000);Object.assign(pl,p)}
    const r=await accion('iniciarTurno',pl);closeModal();
    if(r&&r.alertas&&r.alertas.length)toast('Turno iniciado con aviso: '+r.alertas.join(', '));else toast('Turno iniciado');
    if(!r.offline)await cargaEsc(true);
  }catch(e){toast(e.message,true);b.disabled=false;b.textContent='▶ Iniciar ahora'}
},

lineasProg(){return [...document.querySelectorAll('#progTabla tr[data-esc]')].filter(r=>r.querySelector('.pk').checked).map(r=>({ID:r.dataset.pid,EscoltaID:r.dataset.esc,Hora:r.querySelector('.ph').value,Punto:r.querySelector('.pp').value,Placa:r.querySelector('.pl').value,Tipo:r.querySelector('.pc').value}))},
async guardarProg(){
  const f=val('pf'),ls=ACT.lineasProg();
  if(ls.some(l=>!l.Punto.trim()))return toast('Escribe el punto/ruta de cada escolta marcado',true);
  try{
    // quitar los que se desmarcaron
    const marcados=ls.map(l=>l.ID).filter(Boolean);
    for(const p of A.data.prog){if(!marcados.includes(p.ID))await api('eliminarProgramacion',{id:p.ID})}
    const r=await api('guardarProgramacion',{fecha:f,lineas:ls});toast(`Programación guardada (${r.creados} nuevas, ${r.actualizados} actualizadas)`);irTab('prog')
  }catch(e){toast(e.message,true)}
},
msgProg(){
  const f=val('pf'),ls=ACT.lineasProg();if(!ls.length)return toast('No hay escoltas marcados',true);
  const link=location.origin+location.pathname+'#api='+encodeURIComponent(S.api);
  const E=id=>(A.data.escoltas||[]).find(x=>x.ID===id)||{};
  const indiv=l=>`Hola ${nombreCorto(E(l.EscoltaID).Nombre)}, tu programación para ${fecha(f)}:\n• Tipo: ${TIPOS[l.Tipo]}\n• Hora: ${l.Hora}\n• Punto / ruta: ${l.Punto}${l.Placa?'\n• Placa: '+l.Placa:''}\n\nConfírmala en la app: ${link}`;
  const grupo=(k,it)=>`*${TIPOS[k].toUpperCase()} — ${fecha(f).toUpperCase()}*\n`+it.map(l=>`• ${nombreCorto(E(l.EscoltaID).Nombre)} — ${l.Hora} — ${l.Punto}${l.Placa?' — '+l.Placa:''}`).join('\n')+`\n\nConfirma tu turno en la app: ${link}`;
  const todo=`*PROGRAMACIÓN ${fecha(f).toUpperCase()}*\n`+ORD_T.map(k=>{const it=ls.filter(l=>l.Tipo===k);return it.length?`\n*${TIPOS[k].toUpperCase()}*\n`+it.map(l=>`• ${nombreCorto(E(l.EscoltaID).Nombre)} — ${l.Hora} — ${l.Punto}${l.Placa?' — '+l.Placa:''}`).join('\n'):''}).join('\n')+`\n\nConfirma tu turno en la app: ${link}`;
  let m=`<h2 style="margin-top:0">WhatsApp · ${fecha(f)}</h2><p class="mut" style="margin-top:0">Toca <b>WhatsApp</b> en cada escolta para enviarle su mensaje personal. Si lo guardaste hace poco, usa primero "Guardar programación".</p>`;
  ORD_T.forEach(k=>{const it=ls.filter(l=>l.Tipo===k);if(!it.length)return;
    m+=`<div style="margin:12px 0 4px;padding:6px 8px;background:var(--bg);border-radius:8px"><b>${esc(TIPOS[k])}</b> (${it.length}) <a class="btn ghost sm" style="float:right" target="_blank" rel="noopener" href="${esc(wa('',grupo(k,it)))}">Mensaje del grupo</a></div>`;
    m+=it.map(l=>{const e=E(l.EscoltaID);return `<div class="item"><div class="row"><div class="grow"><b>${esc(nombreCorto(e.Nombre))}</b><br><span class="mut">${esc(l.Hora)} · ${esc(l.Punto)} ${esc(l.Placa)}${e.Telefono?'':' · <span style="color:var(--bad)">sin celular (edítalo en Escoltas)</span>'}</span></div><a class="btn ok sm" target="_blank" rel="noopener" href="${esc(wa(e.Telefono,indiv(l)))}">WhatsApp</a></div></div>`}).join('')});
  m+=`<br><div class="row"><a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(wa('',todo))}">Mensaje general (todo agrupado)</a><button class="btn ghost sm" data-act="copiar" data-v="${esc(todo)}">Copiar general</button></div>`;
  modal(m);
},

  <br><div class="row"><button class="btn ok grow" data-act="guardarTurno">Guardar</button>${t.ID?`<button class="btn bad" data-act="borrarTurno" data-id="${esc(t.ID)}">Eliminar</button>`:''}</div>`);
}
function formGeo(g){modal(`<h2 style="margin-top:0">${g.ID?'Editar':'Nueva'} geocerca</h2><input type="hidden" id="g_id" value="${esc(g.ID||'')}"><label>Nombre</label><input id="g_n" value="${esc(g.Nombre||'')}"><div class="grid2"><div><label>Latitud</label><input id="g_lat" value="${esc(g.Lat||'')}" inputmode="decimal"></div><div><label>Longitud</label><input id="g_lng" value="${esc(g.Lng||'')}" inputmode="decimal"></div><div><label>Radio (m)</label><input id="g_r" type="number" value="${esc(g.RadioM||150)}"></div><div><label>Estado</label><select id="g_a"><option value="SI">Activa</option><option value="NO" ${g.Activa==='NO'?'selected':''}>Inactiva</option></select></div></div><br><div class="row"><button class="btn ghost" data-act="usarMiUbicacion">📍 Usar mi ubicación</button><button class="btn ok grow" data-act="guardarGeo">Guardar</button>${g.ID?`<button class="btn bad" data-act="borrarGeo" data-id="${esc(g.ID)}">Eliminar</button>`:''}</div><p class="mut">Estando en el punto, toca "Usar mi ubicación".</p>`)}
function mostrarPins(l){
  if(!l.length)return toast('No hay escoltas nuevos para crear');
  const txt=l.map(x=>`${x.nombre}: PIN ${x.pin}`).join('\n');
  const tel=id=>{const e=(A.data.escoltas||[]).find(z=>z.ID===id);return e&&e.Telefono};
  modal(`<h2 style="margin-top:0">PIN de acceso</h2><div class="banner warn">Anótalos ahora: por seguridad no se vuelven a mostrar (si se pierde uno, se genera otro con el botón PIN).</div>${l.map(x=>`<div class="item"><b>${esc(x.nombre)}</b> → <span style="font-size:22px;font-weight:700">${esc(x.pin)}</span>${x.id&&tel(x.id)?` <a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(wa(tel(x.id),'Tu PIN para el registro de turnos es '+x.pin))}">WhatsApp</a>`:''}</div>`).join('')}<br><div class="row"><button class="btn" data-act="copiar" data-v="${esc(txt)}">Copiar todos</button><button class="btn ghost" data-act="imprimir">Imprimir</button></div>`);
}
ACT.imprimir=()=>window.print();

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(!f)return;e.preventDefault();f(b.dataset,b);
});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.chg;if(c&&ACT['chg_'+c])ACT['chg_'+c]()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lg_pin')ACT.entrarE();if(e.key==='Enter'&&e.target.id==='lg_clave')LOGIN.rol==='A'?ACT.entrarA():ACT.entrarC()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token){sinLeer=0;document.title='Registro de Turnos';if(S.rol!=='E')pulsoAdm();if(S.rol==='E'){flush();cargaEsc(true)}else if(A.tab==='tablero')irTab('tablero')}});
arrancar();
</script>
